<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="description" content="覇業 HEGEMONY — 三国志を舞台にした国政と戦場のターン制ストラテジー。PixiJS / GSAP / Tone.js / Chart.js を CDN から読む単一 HTML ゲーム。">
<title>覇業 HEGEMONY ― 三国逐鹿戦略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Ma+Shan+Zheng&display=swap">
<!-- ===== 外部ライブラリ（ネットから取得・CDN固定版） =====
     PixiJS  : 戦闘盤面の描画（WebGL）      GSAP : アニメーション
     Tone.js : 音楽と効果音の合成            Chart.js : 国力推移グラフ
     すべて取得に失敗しても自前描画／自前音で動く（オフラインでも遊べる） -->
<script>window.__lib=function(k,ok){ (window.LIBOK=window.LIBOK||{}).set ? LIBOK.set(k,ok) : LIBOK[k]=ok; };</script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js" onload="window.__lib('pixi',1)" onerror="window.__lib('pixi',0)"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" onload="window.__lib('gsap',1)" onerror="window.__lib('gsap',0)"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js" onload="window.__lib('tone',1)" onerror="window.__lib('tone',0)"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js" onload="window.__lib('chart',1)" onerror="window.__lib('chart',0)"></script>
<style>
/* ============================================================
   覇業 HEGEMONY  ―  像素 × 水墨 の UI（豪華刷新版）
   戦略（国政）と戦術（戦闘）は別の画面。縦持ちでも遊べる。
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --pix:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --brush:"Ma Shan Zheng","DotGothic16","Hiragino Kaku Gothic ProN","Songti SC","SimSun",serif;
  --ui:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
  --ink:#07090e; --panel:#121a24; --panel2:#18222e; --line:#435a75; --line2:#273547;
  --gold:#ecc96e; --gold2:#b48a3e; --text:#eeeae0; --muted:#9ab0c7; --danger:#e86a5d; --ok:#68d48f;
  --cinnabar:#c84332;
}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);font-family:var(--ui);
  background:
    radial-gradient(ellipse at 50% -10%,rgba(236,201,110,.10) 0,transparent 48%),
    radial-gradient(ellipse at 50% -12%,#243244 0,#111823 48%,#05070b 88%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 2px,transparent 2px 4px),
    var(--ink);
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button,select,input,textarea{font-family:inherit}
button{
  font-size:12px;font-weight:700;color:#f4f0e6;cursor:pointer;min-height:34px;padding:6px 10px;
  background:linear-gradient(180deg,#2d3f54 0%,#1d2a39 55%,#151f2b 100%);
  border:2px solid #526a84;border-radius:2px;position:relative;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.16),inset -1px -1px 0 rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.55);
  transition:filter .12s ease,transform .08s ease,border-color .15s ease,box-shadow .15s ease;
}
button:hover:not([disabled]){filter:brightness(1.14);border-color:#7896b8;box-shadow:inset 1px 1px 0 rgba(255,255,255,.24),0 0 8px rgba(236,201,110,.18),0 2px 5px rgba(0,0,0,.6)}
button:active:not([disabled]){transform:translateY(1.5px);filter:brightness(.96);box-shadow:inset 2px 2px 3px rgba(0,0,0,.55)}
button[disabled]{opacity:.36;cursor:default;filter:saturate(.6)}
button.pri,button.active,button.lit{background:linear-gradient(180deg,#8f6a22,#5e4213);border-color:#e6c167;box-shadow:inset 1px 1px 0 rgba(255,240,190,.28),0 0 10px rgba(232,197,109,.22),0 2px 4px rgba(0,0,0,.55)}
button.go{background:linear-gradient(180deg,#3f8a57 0%,#28623b 60%,#1d4b2c 100%);border-color:#8ad49c;box-shadow:inset 1px 1px 0 rgba(200,255,215,.25),0 0 10px rgba(103,205,140,.2),0 2px 4px rgba(0,0,0,.55)}
button.warn{background:linear-gradient(180deg,#9c4035 0%,#69271f 60%,#4f1b15 100%);border-color:#e09388;box-shadow:inset 1px 1px 0 rgba(255,200,190,.22),0 0 10px rgba(229,105,92,.2),0 2px 4px rgba(0,0,0,.55)}
button.mini{font-size:10.5px;font-weight:600;min-height:28px;padding:4px 7px;background:linear-gradient(180deg,#1f2c3c,#141d28);border-color:#3d5066}
button.mini.on{background:linear-gradient(180deg,#407850,#285235);border-color:#b2d99b;color:#fff;box-shadow:0 0 8px rgba(103,205,140,.3)}
button.tiny{font-size:10px;min-height:24px;padding:3px 6px;background:linear-gradient(180deg,#1b2735,#121a24);border-color:#364760}
select{font-size:11px;color:#ece7db;background:linear-gradient(180deg,#1d2938,#131b26);border:2px solid #435a75;border-radius:2px;padding:4px 6px;min-height:30px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
input[type=text],input[type=number]{
  font-size:11px;color:#f3ead2;background:#0f1720;border:2px solid #435a75;border-radius:2px;padding:4px 6px;min-width:0;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
}
input[type=range]{flex:1 1 110px;accent-color:#ecc96e;height:22px;cursor:pointer}
.spacer{flex:1 1 auto}
.num{font-family:var(--pix);font-variant-numeric:tabular-nums}
.brush{font-family:var(--brush)}
.grp{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dead{opacity:.45;filter:grayscale(.8)}
.lit{color:var(--gold);text-shadow:0 0 8px rgba(236,201,110,.45)}
.win{color:#8fe0a8}
.lose{color:#f0917f}
.on,.active{border-color:var(--gold)}
.sel{outline:2px solid var(--gold)}
#app{display:flex;flex-direction:column;height:100dvh;height:100svh;position:relative}
.screen{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.screen.on{display:flex}
#scrCamp,#scrBattle{background:radial-gradient(ellipse at 50% 0,rgba(32,48,68,.35),transparent 70%)}
.hidden{display:none!important}

/* ---------- 上HUD / 下バー ---------- */
.topbar,#campTop,#batTop{
  flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:5px 10px;padding-top:calc(5px + env(safe-area-inset-top));
  background:linear-gradient(180deg,#1c2836 0%,#121a24 65%,#0c121a 100%);
  border-bottom:2px solid var(--line);
  box-shadow:0 2px 10px rgba(0,0,0,.55),inset 0 -1px 0 rgba(236,201,110,.16);
}
.chipbox{
  display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);white-space:nowrap;
  background:rgba(10,15,22,.55);border:1px solid #28384b;border-radius:2px;padding:2px 6px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45);
}
.chipbox b{font-family:var(--pix);font-size:13px;color:#f7f2e0;font-weight:400;text-shadow:0 1px 2px #000}
.chipbox.bad{border-color:#7a332c;background:rgba(60,18,15,.45)}.chipbox.bad b{color:var(--danger)}
.chipbox.good{border-color:#2d5e40}.chipbox.good b{color:var(--ok)}
.chipbox.warn2{border-color:#6e5726}.chipbox.warn2 b{color:#f5c96b}
.tag{
  font-family:var(--pix);font-size:11px;padding:2px 7px;border:2px solid var(--line);border-radius:2px;
  color:#eee6ce;background:linear-gradient(180deg,#1d2938,#131c27);white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 3px rgba(0,0,0,.4);
}
.tag.acc{border-color:var(--gold2);color:#fae6b1;background:linear-gradient(180deg,#332510,#1f1608);box-shadow:0 0 8px rgba(232,197,109,.18)}
.bar,#bar{
  flex:0 0 auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 10px;
  padding-bottom:calc(5px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#172230 0%,#0e151f 65%,#090e15 100%);
  border-top:2px solid var(--line);
  box-shadow:0 -2px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(236,201,110,.15);
}
.meter{height:8px;background:#070b10;border:1px solid #314357;border-radius:1px;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.meter>b{display:block;height:100%;transition:width .25s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.meter.gold>b{background:linear-gradient(90deg,#8a661d,#f2cf77)}
.meter.blue>b{background:linear-gradient(90deg,#265b82,#7ed0fa)}
.meter.green>b{background:linear-gradient(90deg,#286b42,#7ee0a0)}
.meter.red>b{background:linear-gradient(90deg,#85312a,#ef9181)}

/* ---------- タイトル ---------- */
#scrTitle{overflow:auto}
#titleIn{flex:1 1 auto;display:grid;grid-template-columns:minmax(185px,34%) 1fr;gap:10px;padding:10px;min-height:0}
#titleArt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;
  background:
    radial-gradient(circle at 50% 28%,rgba(232,197,109,.14),transparent 65%),
    linear-gradient(160deg,#1f2c3c 0%,#121a24 55%,#0b1017 100%);
  border:2px solid var(--gold2);border-radius:3px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 28px rgba(0,0,0,.75),0 6px 20px rgba(0,0,0,.6);
}
#titleArt::before{
  content:"";position:absolute;inset:3px;border:1px solid rgba(236,201,110,.22);pointer-events:none;
}
#titleArt canvas{
  width:100%;max-width:340px;height:auto;image-rendering:pixelated;
  border:2px solid #3c5069;border-radius:2px;box-shadow:0 4px 16px rgba(0,0,0,.7);
}
#titleArt h1{
  font-family:var(--brush);margin:2px 0 0;font-size:clamp(36px,9vh,76px);color:#fbf0d0;letter-spacing:.12em;
  text-shadow:0 2px 0 #8a6421,4px 5px 0 #000,0 0 24px rgba(236,201,110,.42);line-height:1.05;
}
#titleArt .sub{font-family:var(--pix);font-size:11px;color:#d8bc82;letter-spacing:.22em;text-shadow:0 1px 2px #000}
#titleArt .tag2{font-family:var(--pix);font-size:10.5px;color:#9cb3ca;margin-top:2px;text-align:center;line-height:1.6}
#titleArt .ver{position:absolute;right:8px;bottom:6px;font-size:9.5px;color:#788da3;font-family:var(--pix)}
#titleForm{
  display:flex;flex-direction:column;gap:7px;min-width:0;overflow:auto;padding:10px 12px;
  background:linear-gradient(160deg,#192330 0%,#111822 60%,#0c1219 100%);
  border:2px solid var(--line);border-radius:3px;
  box-shadow:inset 0 0 20px rgba(0,0,0,.55),0 6px 20px rgba(0,0,0,.5);
}
#titleForm h2,#titleForm h3{font-family:var(--pix);margin:0 0 2px;font-size:13px;color:var(--gold);letter-spacing:.06em;text-shadow:0 1px 2px #000}
#titleForm h3{font-size:11.5px;color:#e0cb99;margin-top:4px;border-left:3px solid var(--gold2);padding-left:6px}
#statePick{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:6px}
button.statecard{
  display:flex;align-items:center;gap:7px;text-align:left;padding:6px 8px;min-height:44px;font-size:11px;
  background:linear-gradient(180deg,#1e2a38,#141d27);border:2px solid #3a4d63;border-radius:3px;
}
button.statecard:hover{border-color:#7492b4;transform:translateY(-1px)}
button.statecard .dot{width:13px;height:13px;flex:0 0 auto;border:2px solid #080b10;border-radius:2px;box-shadow:0 0 6px currentColor}
button.statecard .nm{font-family:var(--brush);font-size:17.5px;color:#f7f0dd;line-height:1.05;text-shadow:1px 1px 2px #000}
button.statecard .cap{display:block;font-size:9.5px;color:#9bb0c7;font-weight:500;font-family:var(--ui);margin-top:2px}
button.statecard.sel{
  background:linear-gradient(180deg,#7a5a22 0%,#4f3814 65%,#38270d 100%);
  border-color:var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,240,190,.35),0 0 12px rgba(236,201,110,.32),0 3px 6px rgba(0,0,0,.6);
}
#titleBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
#titleBtns button{flex:1 1 120px}
.setrow{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;padding:2px 0}
.setrow b{font-family:var(--pix);color:#f4ead0;font-weight:400;font-size:12px}
.note{font-size:10px;color:#8ba0b8;line-height:1.55;margin:2px 0}
.libdot{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:#96abc2;font-family:var(--pix);background:#111923;padding:2px 6px;border:1px solid #283648;border-radius:2px}
.libdot i{width:8px;height:8px;border:1px solid #0b0f14;border-radius:50%;background:#54687d;display:inline-block}
.libdot.on i{background:#63d98d;box-shadow:0 0 5px #63d98d}.libdot.off i{background:#e0685c}

/* ---------- 戦略（国政） ---------- */
#campMain{flex:1 1 auto;display:grid;grid-template-columns:minmax(118px,16%) minmax(0,1fr) minmax(168px,27%);gap:6px;padding:6px;min-height:0}
.pane{
  background:linear-gradient(165deg,#172230 0%,#101722 60%,#0c121a 100%);
  border:2px solid var(--line2);border-radius:3px;min-height:0;display:flex;flex-direction:column;
  box-shadow:inset 0 0 14px rgba(0,0,0,.45),0 4px 12px rgba(0,0,0,.45);
}
.pane h3{
  font-family:var(--pix);font-size:11px;margin:0;padding:5px 8px;color:#f0dea9;
  background:linear-gradient(90deg,#223042 0%,#182230 100%);
  border-bottom:2px solid var(--line2);border-left:3px solid var(--gold2);
  letter-spacing:.06em;display:flex;gap:5px;align-items:center;text-shadow:0 1px 2px #000;
}
.pane .body{flex:1 1 auto;min-height:0;overflow:auto;padding:6px 7px;font-size:11px;line-height:1.5}
.pane .body::-webkit-scrollbar{width:7px;height:7px}
.pane .body::-webkit-scrollbar-track{background:#0b1017}
.pane .body::-webkit-scrollbar-thumb{background:#384c66;border-radius:2px}
.pane .body::-webkit-scrollbar-thumb:hover{background:#4f6a8c}
#mapWrap{
  position:relative;background:radial-gradient(circle at 50% 50%,#12202e,#080e14);
  border:2px solid #35485e;border-radius:3px;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:inset 0 0 24px rgba(0,0,0,.8),0 4px 14px rgba(0,0,0,.55);
}
#mapc{display:block;touch-action:none;cursor:crosshair;image-rendering:auto}
#mapHint{
  position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#b8cae0;
  background:linear-gradient(rgba(8,12,18,0),rgba(8,12,18,.92));padding:5px 8px 3px;text-align:center;pointer-events:none;
  text-shadow:0 1px 2px #000;
}
#mapTip{
  position:absolute;z-index:5;pointer-events:none;display:none;max-width:250px;
  background:linear-gradient(160deg,rgba(22,33,46,.96),rgba(12,18,26,.98));
  border:2px solid var(--gold2);border-radius:3px;padding:6px 9px;font-size:10.5px;line-height:1.55;color:#e3ebf5;
  box-shadow:0 8px 24px rgba(0,0,0,.75),0 0 10px rgba(232,197,109,.15);
  backdrop-filter:blur(3px);
}
#mapTip b{font-family:var(--pix);color:#f7ebc8;font-weight:400}
.rowline{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dotted #2a3747;font-size:11px}
.rowline span{color:var(--muted)}
.rowline b{font-family:var(--pix);font-weight:400;font-size:12px;color:#f3ebd4}
.wrow{
  display:flex;align-items:center;gap:5px;padding:4px 4px;font-size:11px;
  border-bottom:1px solid rgba(42,56,74,.55);border-radius:2px;cursor:pointer;transition:background .12s ease;
}
.wrow:hover{background:rgba(45,65,90,.45)}
.wrow.me{background:linear-gradient(90deg,rgba(110,85,25,.35),rgba(40,34,14,.25));border-left:2px solid var(--gold)}
.wrow .dot{width:11px;height:11px;flex:0 0 auto;border:2px solid #090d12;border-radius:2px}
.wrow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--brush);font-size:15px;color:#f4eedc}
.wrow .st{font-size:9.5px;font-family:var(--pix);padding:1px 4px;border:1px solid #3d5066;border-radius:2px;color:#d2deec;background:rgba(16,24,34,.6);white-space:nowrap}
.st.war{color:#ffb8ac;border-color:#9e463d;background:linear-gradient(180deg,#3d1a17,#26100e);box-shadow:0 0 6px rgba(229,105,92,.25)}
.st.ally{color:#a6e8bc;border-color:#448559;background:linear-gradient(180deg,#1a3621,#112416)}
.st.truce{color:#eee0a8;border-color:#7a6c39;background:linear-gradient(180deg,#302914,#1f1a0c)}
.st.peace{color:#c2d2e3}
#cityAct{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:6px}
#cityAct button{font-size:10.5px;min-height:34px;padding:4px 6px;text-align:left;line-height:1.25}
#cityAct button i{display:block;font-style:normal;font-size:9px;color:#d6ba7f;font-weight:600;margin-top:1px}
.logline{font-size:10.5px;line-height:1.5;color:#bccce0;padding:2.5px 0;border-bottom:1px dotted #233040}
.logline:first-child{color:#f2f7fc;font-weight:600}
.logline .t{font-family:var(--pix);font-size:9.5px;color:#889db5;margin-right:5px}
.hint{
  font-size:10px;color:#f5dba0;border-left:3px solid var(--gold);padding:4px 7px;
  background:linear-gradient(90deg,rgba(60,48,20,.45),rgba(26,24,16,.25));margin:4px 0;line-height:1.55;border-radius:0 2px 2px 0;
}
.speek{font-size:9.5px;font-family:var(--pix);border:1px solid #526a84;border-radius:2px;padding:0 4px;color:#d5e6f7;background:rgba(25,38,54,.6)}
.speek.unk{color:#8fa3b8;border-color:#354454;background:transparent}
.genbadge{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.genbadge img{width:20px;height:20px;image-rendering:pixelated;border:1px solid #4c627a;border-radius:2px;background:#0e151f}

/* ---------- 戦闘 ---------- */
#batMain{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(156px,25%);gap:6px;padding:6px;min-height:0}
#batSides{flex:1 1 auto;display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden}
.side{
  flex:1 1 0;min-width:0;max-width:310px;font-size:10px;line-height:1.3;
  background:rgba(12,18,26,.55);border:1px solid #2b3b4e;border-radius:3px;padding:3px 7px;
}
.side .nm{font-family:var(--pix);font-size:11.5px;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.side .nm .dot{width:11px;height:11px;border:2px solid #0b0f14;border-radius:2px;flex:0 0 auto}
.side .mini{display:flex;gap:6px;color:var(--muted);font-size:9.5px;margin:2px 0 1px;white-space:nowrap;align-items:center}
.side .mini b{font-family:var(--pix);color:#f3e7c9;font-weight:400}
#batMid{flex:0 0 auto;text-align:center;min-width:82px;padding:2px 6px;background:rgba(15,22,32,.6);border:1px solid #314358;border-radius:3px}
#batTurn{font-family:var(--pix);font-size:13px;color:#fae5ab;white-space:nowrap;text-shadow:0 1px 2px #000}
#batPhase{font-size:9.5px;color:#adc2d9;white-space:nowrap}
#boardWrap{
  flex:1 1 auto;min-height:0;position:relative;
  background:radial-gradient(circle at 50% 50%,#141f2c,#090e15);
  border:2px solid #354960;border-radius:3px;overflow:auto;
  display:flex;align-items:center;justify-content:center;overscroll-behavior:contain;
  box-shadow:inset 0 0 24px rgba(0,0,0,.8),0 4px 14px rgba(0,0,0,.55);
}
#boardHolder{position:relative;flex:0 0 auto;margin:auto;box-shadow:0 6px 24px rgba(0,0,0,.75);border:1px solid #445a73}
#pixiHost{position:absolute;inset:0;overflow:hidden}
#pixiHost canvas{display:block;image-rendering:pixelated}
#domBoard{position:absolute;inset:0;display:grid;gap:2px;padding:4px;background:#0a0f16}
#domBoard .cell{
  position:relative;background:#2f3a2a;background-size:cover;image-rendering:pixelated;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;border-radius:1px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);transition:filter .1s ease;
}

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function ri(n){ return Math.floor(Math.random()*n); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function pick(arr){ return arr[ri(arr.length)]; }
function has(arr,v){ for(var i=0;i<arr.length;i++) if(arr[i]===v) return true; return false; }
function seedRnd(s){ var x=s>>>0; return function(){ x=(x*1664525+1013904223)>>>0; return x/4294967296; }; }
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h>>>0; }
function pk(a,b){ return a<b?a+'|'+b:b+'|'+a; }
function mix(hex,k){
  var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  function f(c){ return clamp(Math.round(k>0?c+(255-c)*k:c*(1+k)),0,255); }
  return '#'+[f(r),f(g),f(b)].map(function(c){ return (c<16?'0':'')+c.toString(16); }).join('');

 help_html:'<h2>覇業 HEGEMONY の遊び方</h2><p>西暦194年、漢室衰えた三国の世が舞台。<b>国を興して天下を統一</b>するのが目的です。<b>国政（戦略）</b>と<b>戦場（戦術）</b>は画面もルールも分かれています。</p>'+
 '<h3>1. 国政レイヤー</h3><ul>'+
 '<li>1季節ごとに<b>収入</b>（市易・農業・特産）と<b>維持費</b>（守備兵の粮）が入り、<b>政令</b>を内政・外交・軍編成・出兵に使います。</li>'+
 '<li>都市をタップして <b>開墾・市易・修城・訓練・徴兵・安抚</b>。街道でつながった隣接都市之间に<b>移駐・分兵</b>。</li>'+
 '<li><b>天候</b>が実収と戦場を左右します（降雨／干魃／霧／雪害／酷暑）。干魃の年は川が浅瀬になり、雨の日は火計が鈍ります。</li>'+
 '<li><b>斥候</b>で敵都市を観測し、<b>離間</b>で他国の関係を裂きます。未観測の都市の数字は<b>？</b>で表示されます。</li>'+
 '<li><b>客将</b>（在野の賢者）は訪れて登用を待ちます。将には<b>忠節</b>があり、褒賞を怠れば国を出ていきます。</li>'+
 '<li>左の勢力リストで<b>使節・講和・同盟・宣戦・離間</b>。<b>威望</b>が高いほど政令が増え、民心30割で反乱が起きます。</li></ul>'+
 '<h3>2. 戦場レイヤー</h3><ul>'+
 '<li>ターン制の盤面。<b>兵は1ターンに1回</b>、移動して攻撃（または攻撃のみ）。</li>'+
 '<li><b>本営</b>を壊す／<b>士気</b>をゼロにする／敵部隊をすべて倒すと勝利。{max}ターンまでに決着しなければ攻め手が敗退します。</li>'+
 '<li>兵科の編成は国政で行い、戦闘中に新兵は作れません。<b>村</b>は回復拠点、包囲（隣接する味方1人ごとに+8%）で攻撃力が上がります。</li>'+
 '<li>同じ敵を倒した兵は<b>歴戦</b>になり攻撃が上がります。长期化すると攻城と消耗が加速します。</li>'+
 '<li><b>自動決着</b>で試算だけ行うこともできます（AI同士の戦いは自動解決）。</li></ul>'+
 '<h3>3. 兵科と相性</h3>{units}<p><b>騎馬は歩兵を蹴散らし、歩兵は弩兵を押さえ、弩兵は槍兵を射抜き、槍兵は騎馬を砕く</b>。隣接攻撃では反撃を受けます（遠隔は反撃なし）。騎馬は山に入れません。</p>'+
 '<h3>4. 将と戦法</h3><p>随伴した将の<b>統率・武力</b>が兵を強くし、ターンごとに溜まる<b>軍略</b>で戦法を放ちます。{_skills}<p>捕らえた将は<b>登用／釈放／処断</b>。処断は他の国の警戒を招きます。同じ将と当たれば<b>因縁</b>が積み、与ダメージが増えます。</p>'+
 '<h3>5. 保存と調度</h3><ul><li>進行は<b>この端末のブラウザ</b>に自動保存されます（ネットへは送りません）。戦闘の途中も復元できます。</li>'+
 '<li>効果音（♪）と音楽（♫）は Tone.js、盤面は PixiJS、演出は GSAP、国力図は Chart.js。CDNから読み、取得出来なければ自前の描画・音に切り替わります。</li></ul>'+
 '<h3>操作</h3><ul><li>国政：都市をタップ→右パネル。<kbd>N</kbd> 季節終了／<kbd>G</kbd> 国力図／<kbd>S</kbd> 保存／<kbd>矢印</kbd> 都市を選ぶ／<kbd>Enter</kbd> 決定。</li>'+
 '<li>戦場：兵をタップ→緑マスへ移動／黄マスへ攻撃。<kbd>Space</kbd> ターン終了／<kbd>U</kbd> 戻す／<kbd>F</kbd> 戦法／<kbd>R</kbd> 撤退／<kbd>A</kbd> 自動決着／<kbd>Esc</kbd> 解除。</li></ul>'
};

 help_html:'<h2>How to play HEGEMONY</h2><p>Set in 194 AD, as the Han wanes. <b>Raise a state and unify the realm.</b> <b>Statecraft</b> and <b>battlefield</b> are separate screens with separate rules.</p>'+
 '<h3>1. Statecraft</h3><ul>'+
 '<li>Each season brings <b>income</b> (trade, farms, specialities) and <b>upkeep</b>. Each <b>decree</b> funds one act of policy, diplomacy, army organization or war.</li>'+
 '<li>Tap a city to <b>Reclaim, Market, Fortify, Drill, Conscript or Relieve</b>; <b>Transfer</b> or <b>Split</b> troops along roads.</li>'+
 '<li><b>Weather</b> steers harvests and battles: rain blunts fire, drought makes rivers fordable, fog shortens missiles, snow slows all.</li>'+
 '<li><b>Scouts</b> observe an enemy city; <b>dissent</b> tears at the relations of others. Unobserved numbers show as <b>?</b>.</li>'+
 '<li><b>Wandering sages</b> await hire. Generals have <b>loyalty</b>: neglect rewards and they leave.</li>'+
 '<li>From the power list: <b>envoy, peace, alliance, war, dissent</b>. <b>Prestige</b> grants decrees; below 30 loyalty revolts break out.</li></ul>'+
 '<h3>2. Battlefield</h3><ul>'+
 '<li>A turn-based board. Each unit acts <b>once per turn</b>: move then strike, or strike only.</li>'+
 '<li>Win by destroying the <b>camp</b>, breaking <b>morale</b> to zero, or defeating every enemy. After {max} turns the attacker is thrown back.</li>'+
 '<li>Troops are organized in statecraft; nothing is recruited mid-battle. <b>Villages</b> heal, and each adjacent ally adds <b>+8%</b> damage.</li>'+
 '<li>Units that kill become <b>veterans</b>. Long battles escalate so stalemates decide themselves.</li>'+
 '<li><b>Auto-resolve</b> will estimate the battle for you; AI-versus-AI battles are resolved automatically.</li></ul>'+
 '<h3>3. Units and match-ups</h3>{units}<p><b>Horse rides down infantry, infantry beats crossbows, crossbows outshoot spears, spears break horse.</b> Melee strikes draw a <b>counterattack</b>; ranged do not. Horse cannot enter mountains.</p>'+
 '<h3>4. Generals and stratagems</h3><p>A general marches with the army; his <b>Lead</b> and <b>Might</b> stiffen the troops. Spending the <b>Stratagem</b> gauge unleashes one of these:</p>{_skills}<p>Captured generals may be <b>hired, released or executed</b>; executions make every court wary. When the same two generals meet again a <b>feud</b> adds damage.</p>'+
 '<h3>5. Saving and libraries</h3><ul><li>Progress is saved automatically <b>in this browser</b>; nothing is sent over the network. Battles in progress are restored too.</li>'+
 '<li>Sound by Tone.js, board by PixiJS, motion by GSAP, charts by Chart.js — loaded from a CDN, each falling back to built-in code if unavailable.</li></ul>'+
 '<h3>Controls</h3><ul><li>Statecraft: tap a city, use the panel. <kbd>N</kbd> end season / <kbd>G</kbd> chart / <kbd>S</kbd> save / <kbd>arrows</kbd> pick a city / <kbd>Enter</kbd> open.</li>'+
 '<li>Battle: tap a unit then a green tile to move or a yellow tile to strike. <kbd>Space</kbd> end turn / <kbd>U</kbd> undo / <kbd>F</kbd> stratagem / <kbd>R</kbd> retreat / <kbd>A</kbd> auto-resolve / <kbd>Esc</kbd> cancel.</li></ul>'
};
/* 翻訳値の解決：都市名・国名・将軍名・兵科名などは表示時に自動で言語化する */
function resolveVal(v){
  if(typeof v!=='string') return v;
  var s=findState(v); if(s) return s.n[LANG]||s.n.en;
  var c=findCity(v); if(c) return c.n[LANG]||c.n.en;
  for(var i=0;i<GENERALS.length;i++) if(GENERALS[i].k===v) return GENERALS[i].n[LANG]||GENERALS[i].n.en;
  if(TYPES[v]) return TYPES[v].n[LANG];
  if(SEASONS.indexOf(v)>=0) return t('sea_'+v);
  if(SKILLS[v]) return SKILLS[v].n[LANG];
  if(TERRAIN[v]) return TERRAIN[v].n[LANG];
  if(WWEA[v]) return t('w_'+v);
  if(SPEC[v]) return t('sp_'+v);
  if(['camp','rout','elim','stale','retreat'].indexOf(v)>=0) return t('rsn_'+v);
  if(DEV[v]) return t('dev_'+v);
  if(v==='p'||v==='e') return t(v==='p'?'r_att':'r_def');
  return v;
}
function t(k,p){
  var L=I18N[LANG]||I18N.ja, s=L[k];
  if(s===undefined&&I18N.ja) s=I18N.ja[k];
  if(s===undefined) return k;
  if(p){
    var q={};
    for(var kk in p) q[kk]=resolveVal(p[kk]);
    s=s.replace(/\{(\w+)\}/g,function(m,n){ return (q[n]===undefined||q[n]===null)?m:''+q[n]; });
  }
  return s;
}

  5,7,8,9, 8,7,5,7,     4,5,4,2, 3,null,5,null

function bgmStart(){

}

}
function bgmNote(freq,dur,type,gain,atOff){
  if(window.Tone) tTone(freq,dur,type,gain,null,atOff);
  else wTone({f:freq,d:dur,type:type,g:gain,at:atOff});

function bgmTick(){
  if(!BGM.on||!SND.on) return;
  var isBat=(typeof curScreen==='function'&&curScreen()==='scrBattle')||!!BT;
  var i=BGM.step++, step=i%32;
  var base=isBat?164.81:146.83; /* 戦場は E3 基調、国政は D3 基調 */
  var mel=isBat?BG_BAT_MEL[step]:BG_CAMP_MEL[step];
  var bass=isBat?BG_BAT_BASS[step]:BG_CAMP_BASS[step];
  /* 1. 主旋律（古筝プラック＋倍音） */
  if(mel!==null&&mel!==undefined){
    var mf=base*2*Math.pow(2,PENTA[mel%PENTA.length]/12);
    bgmNote(mf,isBat?0.24:0.42,isBat?'sawtooth':'triangle',isBat?0.026:0.028,0);
    bgmNote(mf*2,isBat?0.12:0.20,'sine',0.010,0.01);
    /* 竹笛の柔らかい余韻（国政時・フレーズの山場） */
    if(!isBat&&(step%4===0||step%8===2)){
      bgmNote(mf,0.55,'sine',0.016,0.06);
    }
  }
  /* 2. 低音（古琴／戦場ベース） */
  if(bass!==null&&bass!==undefined){
    var bf=base*Math.pow(2,PENTA[bass%PENTA.length]/12);
    bgmNote(bf,isBat?0.28:0.65,'triangle',isBat?0.034:0.026,0);
  }
  /* 3. 戦鼓・拍節パーカッション */
  if(isBat){
    if(step%4===0){
      if(window.Tone) tTone(110,0.18,'sine',0.055,52,0);
      else wTone({f:110,f2:52,d:0.18,type:'sine',g:0.055});
    }else if(step%4===2||step%8===7){
      if(window.Tone) tTone(145,0.11,'sine',0.035,75,0);
      else wTone({f:145,f2:75,d:0.11,type:'sine',g:0.035});
    }
  }else{
    if(step%8===0){
      if(window.Tone) tTone(98,0.24,'sine',0.042,52,0);
      else wTone({f:98,f2:52,d:0.24,type:'sine',g:0.042});
    }
  }
}

/* ---------- 観測（諜報） ---------- */
function observe(ck,turns){

function observed(ck){

  var allyShare=false;

  if(mine||near||allyShare){ observe(ck); return {known:true,garr:d.garr,walls:d.walls,fresh:true}; }
  var v=d.seen;

/* ---------- 収入と維持費 ---------- */
function seasonIncome(k){
  var gold=0,food=0,men=0,seas=SEASONS[S.season],W=WWEA[S.weather]||WWEA.clear;
  citiesOf(k).forEach(function(c){
    var d=S.cities[c.k], sp=wSpec(c.k);
    gold+=2+d.town*2+c.trade*3+((sp&&sp.gold)||0);
    var f=d.farms*(seas==='autumn'?5:1);
    if(seas==='autumn'){
      if(sp&&sp.foodMul) f*=sp.foodMul;
      f*=W.foodMul;
      if(S.famine) f*=0.7;
    }
    food+=Math.round(f);
    men+=Math.round(c.pop/13);
  });
  if(seas==='winter') gold=Math.round(gold*0.85);
  if(k!==S.me) gold=Math.round(gold*(DIFF[S.diff]?DIFF[S.diff].aiIncome:1));
  return {gold:gold,food:food,men:men};
}
function upkeepOf(k){
  var g=totalGarr(k),W=WWEA[S.weather]||WWEA.clear;

  s.intel=clamp(s.intel+1+(s.gold>40?1:0),0,6);

  if(what==='recruit'&&(s.men<need.men||s.food<need.food)) return fail(t('err_nomen'));

function scoutAct(cityKey){

  if(S.cities[cityKey].owner===S.me) return fail(t('err_notyours'));
  s.gold-=5; s.pol-=1; s.intel-=1;

function peaceOdds(a,b){
  var pa=powerOf(a),pb=powerOf(b),o=0.35+(pa>=pb?0.25:-0.25)+relOf(a,b)/200;
  if(st(b).stab<45) o+=0.10;
  if(atWar(a,b)&&warScore(a)>2) o-=0.15;
  if(warScore(a)<-2) o+=0.12;
  return clamp(o,0.06,0.95);
}
function peaceAct(other){

  if(s.gold<d) return fail(t('err_nogold'));
  if(Math.random()>peaceOdds(S.me,other)){
    s.pol-=1; s.gold=Math.max(0,s.gold-Math.round(d*0.3)); bumpRel(S.me,other,-6);
    logLine('log_peace_reject',{s:other}); sfx('err');

  }
  s.gold-=d; s.pol-=1;

}
function allianceAct(other){

function declareWar(a,b,surprise){

/* ---------- 出兵の準備 ---------- */
function canAttack(from,to){
  var a=S.cities[from],b=S.cities[to];
  if(!a||!b) return t('err_nocity');

function armyCompTotal(comp){
  if(!comp) return 0;
  return TKEYS.reduce(function(sum,k){ var n=Math.floor(+comp[k]||0); return sum+(isFinite(n)?Math.max(0,n):0); },0);
}
function armyDoctrine(stateKey){
  var d=st(stateKey),comp=d&&d.armyComp;
  if(armyCompTotal(comp)!==ARMY_COMP_SIZE) return {inf:4,arc:2,cav:2,spc:2};
  var out={}; TKEYS.forEach(function(k){ out[k]=Math.max(0,Math.floor(+comp[k]||0)); });
  return out;
}
function reformArmy(cityKey,comp){

  if(s.pol<ARMY_REFORM.pol) return fail(t('err_nopol'));
  if(TKEYS.every(function(k){ return current[k]===Math.floor(+comp[k]||0); })) return fail(t('err_comp_same'));
  s.gold-=ARMY_REFORM.gold; s.pol-=ARMY_REFORM.pol;
  s.armyComp={}; TKEYS.forEach(function(k){ s.armyComp[k]=Math.floor(+comp[k]||0); });

}

/* ---------- 戦闘結果を国政へ反映 ---------- */
function applyBattleResult(B){
  var ck=B.city,atkState=B.att,defState=B.def;
  var attWin=!!(B.over&&B.over.winner==='att');
  var losses=B.losses||{p:0,e:0};
  var attSurv=Math.max(0,B.commit.p-losses.p),defSurv=Math.max(0,B.commit.e-losses.e);
  var msg=[];
  if(attWin){
    var prevOwner=S.cities[ck].owner;
    S.cities[ck].owner=atkState;
    S.cities[ck].garr=Math.max(4,attSurv);
    S.cities[ck].unrest=clamp(S.cities[ck].unrest+22,0,100);
    observe(ck);
    st(atkState).fame+=8; st(defState).fame-=8;
    logLine('log_take',{a:atkState,c:ck,d:defState});
    msg.push({k:'res_take',p:{c:ck}});
    if(B.gen.e&&Math.random()<0.45) captureGeneral(B.gen.e,atkState);
    if(findState(prevOwner)&&findState(prevOwner).cap===ck&&prevOwner!==atkState) annexState(prevOwner,atkState,msg);
  }else{
    if(S.cities[B.from]) S.cities[B.from].garr+=attSurv;
    S.cities[ck].garr=Math.max(0,defSurv);
    st(defState).fame+=5; st(atkState).fame-=4;
    logLine('log_repel',{d:defState,a:atkState,c:ck});
    msg.push({k:'res_repel',p:{c:ck}});
    if(B.gen.p&&Math.random()<0.28) captureGeneral(B.gen.p,defState);
  }
  return {attWin:attWin,attLoss:losses.p,defLoss:losses.e,attSurv:attSurv,defSurv:defSurv,msg:msg};
}
function captureGeneral(gk,winner){
  if(!gk||!S.gen[gk]||S.gen[gk].dead) return;
  var g=S.gen[gk];
  g.captive=winner; g.city=null;
  if(winner===S.me){
    S.captiveQ=(S.captiveQ||[]); if(S.captiveQ.indexOf(gk)<0) S.captiveQ.push(gk);
    logLine('log_cap_gen',{g:gk});
  }else if(Math.random()<0.5){
    g.side=winner; g.loyal=45; if(findState(winner)) g.city=findState(winner).cap;
    logLine('log_gen_defect',{g:gk,s:winner});
  }else{ g.dead=true; logLine('log_gen_dead',{g:gk}); }
}
function annexState(loser,winner,msg){
  if(!st(loser).alive||loser===winner) return;
  citiesOf(loser).forEach(function(c){
    S.cities[c.k].owner=winner;
    S.cities[c.k].unrest=clamp(S.cities[c.k].unrest+18,0,100);
  });
  st(loser).alive=false; st(loser).focus=null;
  gensOf(loser).forEach(function(g){
    var s=S.gen[g.k];
    if(Math.random()<0.6){ s.side=winner; s.loyal=42; if(findState(winner)) s.city=findState(winner).cap; }
    else s.dead=true;
  });
  STATES.forEach(function(o){
    if(o.k===loser||o.k===winner||!st(o.k).alive) return;
    if(atWar(o.k,loser)) setWar(o.k,loser,'peace',0);
  });
  st(winner).fame+=12;
  logLine('log_annex',{l:loser,w:winner});
  msg.push({k:'res_annex',p:{l:loser,w:winner}});
}
function seasonWeather(){
  var seas=SEASONS[S.season];
  S.weather=pick(WBYSEA[seas]||['clear']);
  logLine('log_weth',{w:S.weather});
}

/* ---------- 季節の終了 ---------- */
function endSeason(){
  if(!S||S.over||S.battle) return;
  st(S.me).pol=0;
  var order=aliveStates();
  order.forEach(function(k){ applyIncome(k); });
  order.forEach(function(k){ if(k!==S.me&&st(k).alive) aiTurn(k); });
  S.turn++; S.season=(S.season+1)%4; S.year=START_YEAR+Math.floor((S.turn-1)/4);
  S.famine=0;
  seasonWeather();
  aliveStates().forEach(function(k){ st(k).pol=polMax(k); });
  checkGenerals();
  var ev=rollEvents();
  decayUnrest();
  expireDiplomacy();
  pushHistory();
  sfx('season');
  logLine('log_season',{y:S.year,s:SEASONS[S.season],w:S.weather,me:st(S.me).pol});
  var end=checkVictory();
  if(typeof renderCamp==='function') renderCamp();
  saveGame(true);
  if(end){ S.pendingBattle=null; if(typeof showGameOver==='function') showGameOver(end); return; }
  if(S.pendingBattle){ if(typeof showEvents==='function') showEvents([]); return; }
  if(typeof showEvents==='function') showEvents(ev||[]);
}
function expireDiplomacy(){
  for(var key in S.war){
    var w=S.war[key];
    if(!w) continue;
    if((w.s==='truce'||w.s==='ally')&&S.turn>=w.t) S.war[key]={s:'peace',t:0};
  }
}
function checkGenerals(){
  var me=S.me;
  aliveStates().forEach(function(k){
    var s=st(k),multi=citiesOf(k).length;
    gensOf(k).forEach(function(g){
      var gg=S.gen[g.k]; if(!gg||gg.dead) return;
      gg.worn++;
      var drain=1+(gg.city&&S.cities[gg.city]&&S.cities[gg.city].owner!==k?2:0)+(s.stab<40?1:0)+(warScore(k)<-2?1:0);
      if(gg.worn>=3){ gg.loyal=clamp(gg.loyal-drain,0,100); }
      if(gg.loyal<25&&multi>0&&Math.random()<0.3){
        var foes=aliveStates().filter(function(j){ return j!==k&&powerOf(j)>powerOf(k)*1.1; });
        if(foes.length&&Math.random()<0.45){
          var to=pick(foes); gg.side=to; gg.loyal=45; gg.city=findState(to).cap;
          logLine('log_gen_defect',{g:g.k,s:to});
          if(k===me) S.notices.push({k:'ev_gen_left',p:{g:g.k}});
        }else{
          gg.side=null; gg.city=null; gg.wander=true; gg.hidden=true; gg.loyal=60;
          logLine('log_gen_left',{g:g.k});
          if(k===me) S.notices.push({k:'ev_gen_left',p:{g:g.k}});
        }
      }
    });
  });
}
function decayUnrest(){
  CITIES.forEach(function(c){
    var d=S.cities[c.k]; if(d.unrest<=0) return;
    d.unrest=Math.max(0,d.unrest-8);
    if(d.unrest>40&&Math.random()<0.4){
      var loss=Math.max(1,Math.round(d.garr*0.1)); d.garr=Math.max(0,d.garr-loss);
      if(d.owner===S.me) logLine('log_unrest',{c:c.k,n:loss});
    }
  });
}
function checkVictory(){
  if(!S||S.over) return S&&S.over;
  var mine=citiesOf(S.me).length;
  if(!st(S.me).alive||mine===0){ S.over={win:false,reason:'lost_all',turn:S.turn}; return S.over; }
  var all=aliveStates();
  if(all.length===1&&all[0]===S.me){ S.over={win:true,reason:'unify',turn:S.turn}; return S.over; }
  if(mine===CITIES.length){ S.over={win:true,reason:'unify',turn:S.turn}; return S.over; }
  return null;
}
function pushHistory(){
  var h={turn:S.turn,y:S.year,sea:S.season,w:S.weather,cities:{},mil:{},gold:{},prestige:{}};
  aliveStates().forEach(function(k){
    h.cities[k]=citiesOf(k).length; h.mil[k]=totalGarr(k);
    h.gold[k]=st(k).gold; h.prestige[k]=calcPrestige(k);
  });
  S.hist.push(h);
  if(S.hist.length>120) S.hist.shift();
}

/* ---------- 季節イベント ---------- */
function rollEvents(){
  var out=[],me=st(S.me),W=WWEA[S.weather]||WWEA.clear;
  function evt(k,p){ out.push({k:k,p:p||null}); }
  var r=Math.random(),heatPenalty=W.sick?0.05:0;
  if(S.weather==='drought'&&r<0.5){
    S.famine=1; evt('ev_famine',null); logLine('log_ev_famine',null);
  }else if(r<0.11){
    var f=8+ri(14); me.food+=f; evt('ev_good',{v:f}); logLine('log_ev_good',{v:f});
  }else if(r<0.20){
    var own=citiesOf(S.me);
    if(own.length){
      var lk=pick(own);
      S.cities[lk.k].farms=Math.max(1,S.cities[lk.k].farms-(lk.farms>1?1:0));
      me.food=Math.max(0,me.food-12);
      evt('ev_bad',{c:lk.k}); logLine('log_ev_bad',{c:lk.k});
    }
  }else if(r<0.27){
    if(me.stab<32){
      var own2=citiesOf(S.me),c2=own2.length?pick(own2):null;
      if(c2){ S.cities[c2.k].unrest=clamp(S.cities[c2.k].unrest+30,0,100); S.cities[c2.k].garr=Math.max(0,S.cities[c2.k].garr-6);
        evt('ev_rebel',{c:c2.k}); logLine('log_ev_rebel',{c:c2.k}); }
    }
  }else if(r<0.34){
    var wand=hiddenGens();
    if(wand.length){
      var gk=pick(wand).k;
      S.gen[gk].hidden=false;
      evt('ev_guest',{g:gk}); logLine('log_ev_guest',{g:gk}); S.guest=gk;
    }
  }else if(r<0.40){
    var gg=6+ri(10); me.gold+=gg; evt('ev_market',{v:gg}); logLine('log_ev_market',{v:gg});
  }else if(r<0.44+heatPenalty){
    var own3=citiesOf(S.me),c3=own3.length?pick(own3):null;
    if(c3){ S.cities[c3.k].pop=Math.max(6,S.cities[c3.k].pop-4); S.cities[c3.k].garr=Math.max(0,S.cities[c3.k].garr-4);
      evt('ev_plague',{c:c3.k}); logLine('log_ev_plague',{c:c3.k}); }
  }else if(r<0.48){
    var horse=citiesOf(S.me).filter(function(c){ return specOf(c.k)==='horse'; });
    var hc=horse.length?pick(horse):null;
    if(hc){ S.cities[hc.k].train=Math.min(5,S.cities[hc.k].train+1); evt('ev_cavalry',{c:hc.k}); logLine('log_ev_cavalry',{c:hc.k}); }
  }
  aliveStates().forEach(function(k){
    if(k===S.me||!st(k).alive) return;
    var q=Math.random();
    if(q<0.10) st(k).food+=10+ri(12);
    else if(q<0.17){ st(k).food=Math.max(0,st(k).food-10); st(k).stab=clamp(st(k).stab-4,0,100); }
    else if(q<0.21&&st(k).stab<35){
      var own=citiesOf(k);
      if(own.length){ var cc=pick(own); S.cities[cc.k].unrest+=26; S.cities[cc.k].garr=Math.max(0,S.cities[cc.k].garr-5); }
    }
    var wand2=hiddenGens();
    if(wand2.length&&Math.random()<0.06){ var g2=pick(wand2).k; S.gen[g2].hidden=false; S.gen[g2].wander=false;
      S.gen[g2].side=k; S.gen[g2].city=findState(k).cap; S.gen[g2].loyal=70; st(k).gold=Math.max(0,st(k).gold-30);
      logLine('log_ai_hire',{s:k,g:g2}); }
  });
  return out;
}
/* =====================================================================
   6. 他国AI ― 目標（focus）を持ち、戦線に兵を集中させ、外交で隙をうかがう
   ===================================================================== */
function aiTurn(k){
  var D=DIFF[S.diff]||DIFF.normal;
  if(!st(k).alive) return;
  aiDiplomacy(k,D);
  aiFocus(k,D);
  aiMove(k,D);
  aiMilitary(k,D);
  aiDomestic(k,D);
}
function aiThreat(k,ck){
  var v=0;
  neighbors(ck).forEach(function(l){
    var d=S.cities[l.to];
    if(d.owner!==k&&(atWar(k,d.owner)||relOf(k,d.owner)<-35)) v+=d.garr;
  });
  return v;
}
function borderCities(k){
  return citiesOf(k).filter(function(c){
    var l=neighbors(c.k);
    for(var i=0;i<l.length;i++) if(S.cities[l[i].to].owner!==k) return true;
    return false;
  });
}
function distMap(k){
  var own=citiesOf(k),dist={},q=[],i;
  own.forEach(function(c){ dist[c.k]=0; q.push(c.k); });
  while(q.length){
    var cur=q.shift(),d0=dist[cur],l=neighbors(cur);
    for(i=0;i<l.length;i++){ var nk=l[i].to; if(dist[nk]===undefined){ dist[nk]=d0+1; q.push(nk); } }
  }
  return dist;
}
function atWarCount(k){
  return aliveStates().filter(function(j){ return j!==k&&atWar(k,j); }).length;
}
function strongestFoe(k){
  var best=null;
  aliveStates().forEach(function(j){
    if(j===k||!atWar(k,j)) return;
    if(!best||powerOf(j)>best.p) best={k:j,p:powerOf(j)};
  });
  return best;
}
function aiFocus(k,D){
  var s=st(k),foes=aliveStates().filter(function(j){ return j!==k&&atWar(k,j); });
  if(!foes.length){ s.focus=null; return; }
  if(s.focus&&findCity(s.focus.city)&&S.cities[s.focus.city].owner===s.focus.foe&&(S.turn-s.focus.t)<3) return;
  var own=citiesOf(k),best=null;
  own.forEach(function(c){
    neighbors(c.k).forEach(function(l){
      var o=S.cities[l.to];
      if(o.owner===k||!st(o.owner).alive) return;
      if(!atWar(k,o.owner)||truced(k,o.owner)) return;
      var cap=(findState(o.owner).cap===l.to)?7:0;
      var sc=(o.pop*0.55+o.trade*2+cap)-(o.garr*0.8+o.walls*3.2)-(o.unrest>0?-o.unrest*0.08:0);
      if(citiesOf(o.owner).length<=2) sc+=10;
      if(l.t==='mountain') sc-=2.5;
      if(s.focus&&s.focus.foe===o.owner) sc+=5;
      if(!best||sc>best.sc) best={sc:sc,city:l.to,foe:o.owner,t:S.turn};
    });
  });
  if(best){
    if(!s.focus||s.focus.city!==best.city) logLine('log_ai_focus',{a:k,c:best.city});
    s.focus=best;
  }else s.focus=null;
}
function aiMove(k,D){
  var s=st(k),guard=0;
  var front=s.focus?s.focus.city:null;
  if(!front){
    var foes=aliveStates().filter(function(j){ return j!==k&&atWar(k,j); });
    if(foes.length){
      var dm0=distMap(k),bb=null;
      CITIES.forEach(function(c){
        if(S.cities[c.k].owner!==k&&st(S.cities[c.k].owner).alive&&atWar(k,S.cities[c.k].owner)){
          var d=dm0[c.k]; if(d!==undefined&&(!bb||d<bb.d)) bb={d:d,city:c.k};
        }
      });
      if(bb) front=bb.city;
    }
  }
  var dm=distMap(k);
  citiesOf(k).forEach(function(c){
    if(s.pol<=0||guard>=3) return;
    var d=S.cities[c.k];
    if(d.garr<8) return;
    var th=aiThreat(k,c.k);
    if(th>0&&d.garr<th*1.15) return;                       // 前線は据える
    var df=(dm[c.k]===undefined?9:dm[c.k]);
    var to=null,better=0;
    neighbors(c.k).forEach(function(l){
      var o=S.cities[l.to];
      if(o.owner!==k) return;
      var dl=(dm[l.to]===undefined?9:dm[l.to]);
      var gain=(df-dl);
      if(front&&l.to===front) gain+=2;
      if(front&&S.cities[l.to].owner===k){
        var lf=neighbors(l.to).some(function(x){ return S.cities[x.to].owner===(s.focus?s.focus.foe:null); });
        if(lf) gain+=1.5;
      }
      if(dl<df&&gain>better&&!aiThreat(k,l.to)){ better=gain; to=l.to; }
    });
    if(!front&&to) return;                                  // 戦線が無いときは動かさない
    if(to&&Math.random()<0.75-D.noise*0.4){
      s.pol-=1; guard++;
      var amt=Math.max(4,Math.ceil(d.garr*0.5));
      d.garr-=amt; S.cities[to].garr+=amt;
      logLine('log_ai_move',{a:k,f:c.k,t:to,n:amt});
    }
  });
  // 危急の増援：脅かされた都市へ急ぐ
  borderCities(k).forEach(function(c){
    if(s.pol<=0) return;
    var d=S.cities[c.k],th=aiThreat(k,c.k);
    if(th<d.garr*1.15) return;
    var src=null;
    neighbors(c.k).forEach(function(l){
      var o=S.cities[l.to];
      if(o.owner!==k||o.garr<10) return;
      if(aiThreat(k,l.to)>o.garr*0.8) return;
      if(!src||o.garr>src.garr) src={k:l.to,garr:o.garr};
    });
    if(src){
      s.pol-=1;
      var amt2=Math.max(4,Math.ceil(src.garr*0.6));
      S.cities[src.k].garr-=amt2; d.garr+=amt2;
      logLine('log_ai_move',{a:k,f:src.k,t:c.k,n:amt2});
    }
  });
}
function aiBestGeneral(k,from){
  var best=null,bv=-1;
  gensOf(k).forEach(function(g){
    var s=S.gen[g.k]; if(!s||s.dead) return;
    var v=g.lead*2+g.war+g.int;
    if(s.city===from) v+=30;
    else if(s.city&&S.cities[s.city]&&S.cities[s.city].owner===k&&linkInfo(s.city,from)) v+=10;
    else if(s.city&&S.cities[s.city]&&S.cities[s.city].owner===k) v+=4;
    if(v>bv){ bv=v; best=g.k; }
  });
  if(best&&S.gen[best].city!==from) S.gen[best].city=from;
  return best;
}
function aiMilitary(k,D){
  var s=st(k),guard=0;
  while(s.pol>=2&&guard++<3){
    if(Math.random()<D.blunder) break;
    var best=null;
    citiesOf(k).forEach(function(c){
      var d=S.cities[c.k];
      if(d.garr<10) return;
      neighbors(c.k).forEach(function(l){
        var o=S.cities[l.to],owner=o.owner;
        if(owner===k||!st(owner).alive) return;
        if(truced(k,owner)) return;
        if(allied(owner,S.me)&&k!==S.me&&aliveStates().length>2) return;   //  player の同盟国には手を出しにくい
        var qa=cityQuality(c.k),qb=cityQuality(l.to);
        var ratio=(d.garr*qa)/Math.max(1,(o.garr+o.walls*3)*qb);
        var need=1.34-0.45*(D.aggro-0.5);
        if(citiesOf(owner).length<=2) need=0.92;
        if(atWar(k,owner)) need-=0.22;
        if(s.focus&&s.focus.city===l.to) need-=0.20;
        if(o.unrest>45) need-=0.20;
        if(S.turn<=6) need+=0.28;
        if(l.t==='mountain') need+=0.12;
        if(l.t==='river') need+=0.06;
        if(ratio<Math.max(1.02,need)) return;
        var sc=ratio*10+o.pop*0.4+o.trade*5+o.unrest*0.05-(findState(owner).cap===l.to?5:0);
        if(s.focus&&s.focus.city===l.to) sc+=14;
        if(!best||sc>best.sc) best={sc:sc,from:c.k,to:l.to,ratio:ratio,owner:owner};
      });
    });
    if(!best) break;
    if(!atWar(k,best.owner)){
      if(!aiMayDeclare(k,best.owner,D)) break;
      declareWar(k,best.owner,false);
      if(best.owner===S.me&&typeof showWarNotice==='function') showWarNotice(k);
    }
    var gk=aiBestGeneral(k,best.from);
    var commit=Math.max(8,S.cities[best.from].garr-2);
    S.cities[best.from].garr-=commit;
    if(best.owner===S.me&&!S.pendingBattle&&!S.battle){
      S.pendingBattle={from:best.from,to:best.to,commit:commit,gen:gk,att:k};
      if(typeof showInvasionNotice==='function') showInvasionNotice(k,best.to);
      break;
    }
    var B=makeBattle(best.from,best.to,commit,gk,true);
    simBattle(B);
    var applied=applyBattleResult(B);
    logLine('log_ai_battle',{a:k,d:best.owner,c:best.to,w:applied.attWin?'a':'d',l:applied.attLoss+applied.defLoss});
    if(best.owner===S.me){
      if(typeof aiBattleNotice==='function') aiBattleNotice(k,best.from,best.to,applied);
      break;
    }
    if(checkVictory()) break;
  }
}
function aiMayDeclare(k,other,D){
  if(allied(k,other)) return false;
  var mine=powerOf(k),theirs=powerOf(other);
  if(mine<theirs*0.85) return false;
  var foes=aliveStates().filter(function(j){ return j!==k&&atWar(k,j)&&powerOf(j)>mine*0.9; });
  if(foes.length&&Math.random()<0.7) return false;                 // 強敵と二正面は避ける
  if(st(k).food<upkeepOf(k).food*1.5) return false;
  if(allied(other,S.me)&&Math.random()<0.5) return false;
  return Math.random()<0.5+0.5*D.aggro;
}
function aiDiplomacy(k,D){
  var s=st(k),nWar=atWarCount(k);
  STATES.forEach(function(o){
    var j=o.k;
    if(j===k||!st(j).alive) return;
    if(atWar(k,j)){
      var weak=(s.stab<45||s.food<upkeepOf(k).food||s.gold<15||warScore(k)<-1||nWar>=2);
      if(weak&&Math.random()<0.5*D.aggro+0.28){
        var pay=Math.min(s.gold,10+ri(14));
        s.gold-=pay; st(j).gold+=pay;
        setWar(k,j,'truce',S.turn+6); bumpRel(k,j,12);
        logLine('log_ai_peace',{a:k,b:j,v:pay});
      }else if(Math.random()<0.26*D.aggro&&powerOf(k)>powerOf(j)*1.3){
        st(k).fame+=1; logLine('log_ai_pressure',{a:k,b:j});
      }
      return;
    }
    var w=warOf(k,j);
    if(w&&(w.s==='truce'||w.s==='ally')&&S.turn>=w.t) setWar(k,j,'peace',0);
    var r=relOf(k,j),adj=adjacentPair(k,j);
    var pkv=pk(k,j);
    if(!atWar(k,j)&&!(w&&w.s==='truce')){
      S.peaceCnt[pkv]=(S.peaceCnt[pkv]||0)+1;
      var wear=S.peaceCnt[pkv]>=5;
      var opportune=(r<-25)||(wear&&powerOf(k)>powerOf(j)*0.95)||((st(k).hatred[j]||0)>2&&r<10);
      if(adj&&opportune&&aiMayDeclare(k,j,D)&&!allied(j,S.me)){
        declareWar(k,j,false);
        if(j===S.me&&typeof showWarNotice==='function') showWarNotice(k);
        return;
      }
    }else if(!(w&&w.s==='ally')) S.peaceCnt[pkv]=0;
    if(adj&&r>55&&!allied(k,j)&&Math.random()<0.22){ setWar(k,j,'ally',S.turn+12); logLine('log_ai_ally',{a:k,b:j}); return; }
    if(r<0&&s.pol>=1&&s.gold>=8&&Math.random()<0.32){ s.pol-=1; s.gold-=8; bumpRel(k,j,10); }
    if(s.gold>=20&&s.intel>=1&&Math.random()<0.12*D.aggro){
      var third=aliveStates().filter(function(m){ return m!==k&&m!==j; });
      if(third.length){
        s.gold-=14; s.intel-=1;
        var t2=pick(third);
        setRel(j,t2,relOf(j,t2)-(6+ri(8)));
      }
    }
  });
}
function adjacentPair(a,b){
  for(var i=0;i<CITIES.length;i++){
    if(S.cities[CITIES[i].k].owner!==a) continue;
    var ls=neighbors(CITIES[i].k);
    for(var j=0;j<ls.length;j++) if(S.cities[ls[j].to].owner===b) return true;
  }

}
function aiDomestic(k,D){
  var s=st(k),guard=0,own=citiesOf(k);
  if(!own.length) return;
  while(s.pol>0&&guard++<8){
    s.pol-=1;
    var want=aiBestDev(k,D);
    if(!want) break;
    if(want.what==='appease'){
      if(s.gold<DEV.appease.gold) continue;
      s.gold-=DEV.appease.gold; s.stab=clamp(s.stab+7,0,100); continue;
    }
    if(want.what==='recruit'){
      var need=devCost(want.city,'recruit');
      if(s.men<need.men||s.food<need.food||s.gold<need.gold) continue;
      var W=WWEA[S.weather]||WWEA.clear;
      s.men-=need.men; s.food-=need.food; s.gold-=need.gold;
      S.cities[want.city].garr+=Math.max(4,Math.round(8*(W.recruitMul||1))+specBonus(want.city,'recruitMen'));
      continue;
    }
    if(want.what==='reward'){
      if(s.gold<12||!want.gen) continue;
      s.gold-=12; S.gen[want.gen].loyal=clamp(S.gen[want.gen].loyal+18,0,100); S.gen[want.gen].worn=0;
      continue;
    }
    var need2=devCost(want.city,want.what);
    if(s.gold<need2.gold||S.cities[want.city][want.what]>=5) continue;
    s.gold-=need2.gold; S.cities[want.city][want.what]+=1;
  }
  var wand=availGens();
  if(wand.length&&s.gold>=40&&Math.random()<0.34*D.aggro){
    var gk=pick(wand).k,g=S.gen[gk];
    g.wander=false; g.side=k; g.city=findState(k).cap; g.loyal=72; s.gold-=30;
    logLine('log_ai_hire',{s:k,g:gk});
    if(S.guest===gk) S.guest=null;
  }
}
function aiBestDev(k,D){
  var s=st(k),own=citiesOf(k),up=upkeepOf(k);
  var threat=0;
  borderCities(k).forEach(function(c){ threat+=aiThreat(k,c.k); });
  var pool=[];
  function cand(what,city,base){ if(!city) return; pool.push({what:what,city:city,sc:base*(1+rnd(-D.noise,D.noise))}); }
  var pickCity=function(pred){ var arr=own.filter(pred); return arr.length?pick(arr).k:null; };
  if(s.food<up.food*2) pool.push({what:'farms',city:pickCity(function(c){ return S.cities[c.k].farms<5; }),sc:3.4});
  if(s.gold<25) pool.push({what:'town',city:pickCity(function(c){ return S.cities[c.k].town<5; }),sc:3.0});
  if(s.gold<25) pool.push({what:'appease',city:null,sc:1.2});
  if(s.stab<50) pool.push({what:'appease',city:null,sc:(55-s.stab)*0.12});
  if(threat>s.men*0.5&&s.men>=12) pool.push({what:'recruit',city:pickCity(function(c){ return true; }),sc:2.6});
  borderCities(k).forEach(function(c){
    if(S.cities[c.k].walls<5&&threat>0) cand('walls',c.k,1.6+S.cities[c.k].unrest*0.01);
    if(S.cities[c.k].train<5) cand('train',c.k,1.3);
    if(S.cities[c.k].farms<5) cand('farms',c.k,1.1+(specOf(c.k)==='rice'?0.7:0));
    if(S.cities[c.k].town<5) cand('town',c.k,1.0+(wSpec(c.k)&&wSpec(c.k).gold?0.8:0));
  });
  own.forEach(function(c){
    if(S.cities[c.k].train<5) cand('train',c.k,0.9);
    if(S.cities[c.k].farms<5) cand('farms',c.k,0.8);
  });
  var lowLoy=gensOf(k).filter(function(g){ return S.gen[g.k].loyal<45; });
  if(lowLoy.length&&s.gold>=24) pool.push({what:'reward',city:null,gen:lowLoy[0].k,sc:2.4});
  pool=pool.filter(function(p){ return p.what==='appease'||p.what==='reward'||p.city; });
  if(!pool.length) return null;
  pool.sort(function(a,b){ return b.sc-a.sc; });
  return pool[0];
}
/* =====================================================================
   7. 戦術（戦闘）レイヤー
   ・ターン制：移動→攻撃（1兵1回）／村は回復拠点／隣接反撃
   ・本営を壊す／士気が尽きる／兵がいなくなると決着
   ・天候・包囲・歴戦・因縁が戦闘係数に効く
   ===================================================================== */
var P='p',E='e';
function wmod(){ return WWEA[(BT&&BT.weather)||S.weather]||WWEA.clear; }
function pickGenForCity(stateKey,cityKey){
  var inCity=gensAt(cityKey).filter(function(g){ return S.gen[g.k].side===stateKey; });
  if(!inCity.length){
    neighbors(cityKey).forEach(function(l){
      if(S.cities[l.to]&&S.cities[l.to].owner===stateKey){
        gensAt(l.to).forEach(function(g){ if(S.gen[g.k].side===stateKey) inCity.push(g); });
      }
    });
  }
  var best=null,bv=-1;
  inCity.forEach(function(g){
    var v=g.lead*2+g.war+g.int+(S.gen[g.k].city===cityKey?20:0);
    if(v>bv){ bv=v; best=g.k; }
  });
  return best;
}
function qualityOf(stateKey,cityKey,genKey){
  var d=S.cities[cityKey],q=1+0.04*d.train+0.002*st(stateKey).stab;
  if(d.unrest>40) q-=0.05;
  if(genKey){ var g=genData(genKey); if(g) q+=0.01*(g.lead+g.war); }
  return q;
}
function initMorale(stateKey,commit,genKey){
  var m=62+Math.min(22,commit*0.6)+(genKey?(genData(genKey)||{lead:5}).lead*2:0)+st(stateKey).stab*0.15;
  return Math.round(clamp(m,45,100));
}
function unitMods(stateKey,cityKey){
  var m={infHp:1,cavAtk:1};
  var sp=wSpec(cityKey);
  if(sp){ if(sp.infHp) m.infHp=sp.infHp; if(sp.cavAtk) m.cavAtk=sp.cavAtk; }
  citiesOf(stateKey).forEach(function(c){
    var s2=wSpec(c.k);
    if(s2&&s2.cavAtk) m.cavAtk=Math.max(m.cavAtk,s2.cavAtk);
  });
  return m;
}
function feudMul(aGen,bGen){
  if(!aGen||!bGen) return 1;
  var n=S.rivals[pk(aGen,bGen)]||0;
  return 1+Math.min(0.18,n*0.03);
}
function makeBattle(fromKey,toKey,commit,attGen,auto,attComp){
  var from=S.cities[fromKey],to=S.cities[toKey];
  var att=from.owner,def=to.owner;
  var meAtk=(att===S.me);
  var siege=(to.walls>=3);
  var defGen=(def===S.me)?pickGenForCity(def,toKey):aiBestGeneral(def,toKey);
  var atkGen=(att===S.me)?attGen:aiBestGeneral(att,fromKey);
  var defCom=Math.max(6,to.garr);
  var B={
    seed:((S.seed^(hashStr(fromKey)*7919+hashStr(toKey)*104729+S.turn*31+ri(997)))>>>0),
    city:toKey,from:fromKey,att:att,def:def,attIsMe:meAtk,meSide:meAtk?'p':'e',
    auto:!!auto,siege:siege,walls:to.walls,link:(linkInfo(fromKey,toKey)||{t:'plain'}).t,
    weather:S.weather||'clear',
    cols:siege?15:13,rows:siege?11:9,tiles:[],units:[],uid:1,
    basePos:{p:null,e:null},baseHp:{p:0,e:0},cap:{p:0,e:0},
    morale:{p:0,e:0},commit:{p:commit,e:defCom},losses:{p:0,e:0},
    tac:{p:1,e:1},gen:{p:atkGen,e:defGen},qmul:{p:1,e:1},mods:{p:null,e:null},
    turn:1,maxTurn:BMAX_TURN,sel:null,skill:null,log:[],over:null,undo:[],
    pState:att,eState:def
  };
  B.qmul.p=qualityOf(att,fromKey,atkGen);
  B.qmul.e=qualityOf(def,toKey,defGen);
  B.mods.p=unitMods(att,fromKey);
  B.mods.e=unitMods(def,toKey);
  B.cap.p=battleUnitCount(commit);
  B.cap.e=battleUnitCount(defCom);
  B.baseHp.p=baseMax(B,'p');
  B.baseHp.e=baseMax(B,'e');
  B.morale.p=initMorale(att,commit,atkGen);
  B.morale.e=initMorale(def,defCom,defGen);
  genBattleMap(B);
  var playerComp=null;
  if(meAtk||def===S.me){
    var playerCommit=meAtk?commit:defCom;
    playerComp=attComp||armyCompForState(S.me,fromKey,toKey,battleUnitCount(playerCommit));
  }
  deployInitial(B,'p',meAtk?playerComp:null);
  deployInitial(B,'e',!meAtk?playerComp:null);
  if(atkGen&&defGen){
    var rk=pk(atkGen,defGen),rc=S.rivals[rk]||0;
    if(rc>0){
      blog(B,'b_rival',{g:atkGen});

function skillNeedsTarget(key){ return key==='fire'||key==='dissent'||key==='volley'||key==='charge'; }

/* ---------- 戦闘AI ---------- */
function costMap(B,type,targets){
  var dist={},q=[],guard=0,W=wmodOf(B);
  (targets||[]).forEach(function(t){ if(!t) return; dist[t.x+','+t.y]=0; q.push({d:0,x:t.x,y:t.y}); });
  while(q.length&&guard++<5000){
    q.sort(function(a,b){ return a.d-b.d; });
    var c=q.shift(),k=c.x+','+c.y;
    if(dist[k]<c.d) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var nx=c.x+d[0],ny=c.y+d[1];
      if(nx<0||ny<0||nx>=B.cols||ny>=B.rows) return;
      var t=B.tiles[ny][nx].t;
      if(!isFinite(TERRAIN[t].cost)) return;
      if(t==='mountain'&&TYPES[type].noMountain) return;
      var nd=c.d+Math.max(1,TERRAIN[t].cost+(W.move||0)),nk=nx+','+ny;
      if(dist[nk]===undefined||nd<dist[nk]){ dist[nk]=nd; q.push({d:nd,x:nx,y:ny}); }
    });
  }
  return dist;
}
function threatAt(B,x,y,side){
  var sum=0,foes=bUnits(B,enemyOf(side));
  foes.forEach(function(o){
    var T=TYPES[o.type],dist=Math.abs(o.x-x)+Math.abs(o.y-y);
    if(dist<=T.move+rangeOf(B,o)) sum+=T.atk*B.qmul[o.side]*(o.hp/o.max)*0.6;
  });
  return sum;
}
function aiSide(B,side){
  if(B.over) return;
  aiUseSkill(B,side);
  var list=bUnits(B,side).slice().sort(function(a,b){ return TYPES[b.type].atk-TYPES[a.type].atk; });
  list.forEach(function(u){
    if(B.over||u.side!==side||u.acted) return;
    if(B.units.indexOf(u)<0) return;
    aiActUnit(B,u);
  });
}
function aiUseSkill(B,side){
  if(!skillReady(B,side)) return;
  var sk=skillOf(B,side),W=wmodOf(B),foe=enemyOf(side),mine=bUnits(B,side),foes=bUnits(B,foe);
  if(sk.key==='fire'){
    if(W.noBurn&&B.weather==='rain'&&Math.random()<0.6) return;
    var best=null;
    for(var y=0;y<B.rows;y++) for(var x=0;x<B.cols;x++){
      var n=0;
      for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
        var yy=y+dy,xx=x+dx;
        if(yy<0||xx<0||yy>=B.rows||xx>=B.cols) continue;
        var u=bUnitAt(B,xx,yy); if(u&&u.side!==side) n++;
      }
      if(n>=2&&(!best||n>best.n)) best={n:n,x:x,y:y};
    }
    if(best){ useSkill(B,side,best.x,best.y); return; }
  }else if(sk.key==='volley'){
    var col=null;
    for(var x2=0;x2<B.cols;x2++){
      var cnt=0;
      foes.forEach(function(o){ if(o.x===x2) cnt++; });
      if(cnt>=2&&(!col||cnt>col.n)) col={n:cnt,x:x2,y:Math.round(B.rows/2)};
    }
    if(col){ useSkill(B,side,col.x,col.y); return; }
  }else if(sk.key==='charge'){
    var pickU=null,bd=99;
    mine.forEach(function(u){
      if(u.acted) return;
      foes.forEach(function(o){ var d=Math.abs(u.x-o.x)+Math.abs(u.y-o.y); if(d<bd){ bd=d; pickU=u; } });
    });
    if(pickU&&bd<=4){ useSkill(B,side,pickU.x,pickU.y); return; }
  }else if(sk.key==='rally'){
    var tot=0,hp=0;
    mine.forEach(function(u){ tot++; hp+=u.hp/u.max; });
    if(tot&&B.morale[side]<58&&hp/tot<0.68){ useSkill(B,side,0,0); return; }
  }else if(sk.key==='surprise'){
    var near=0;
    var bb=B.basePos[side];
    if(bb) foes.forEach(function(o){ if(Math.abs(o.x-bb.x)+Math.abs(o.y-bb.y)<=3) near++; });
    if(near>=2||B.tac[side]>=3){ useSkill(B,side,0,0); return; }
  }else if(sk.key==='dissent'){
    var target=null,worst=1e9;
    foes.forEach(function(o){
      var val=(o.hp/o.max)*(TYPES[o.type].atk+TYPES[o.type].hp/4);
      if(B.morale[foe]<52&&val<worst){ worst=val; target=o; }
    });
    if(target&&B.tac[side]>=3&&Math.random()<0.7){ useSkill(B,side,target.x,target.y); return; }
  }
}
function bestAttackFrom(B,u,x,y){
  var list=bTargets(B,u,x,y),best=null;
  list.forEach(function(tg){
    var dmg=rollDmg(B,u,tg,false),val=dmg;
    if(tg.kind==='unit'){
      var d=tg.u;
      if(dmg>=d.hp) val+=11;
      val+=flankOf(B,u,tg)*3;
      var dist=Math.abs(u.x-d.x)+Math.abs(u.y-d.y);
      if(TYPES[d.type].range===1&&dist<=1&&u.buff<2) val-=rollDmg(B,d,{kind:'unit',u:u},true)*0.85;
      val+=defOf(B,x,y)*0.4;
    }else val+=8;
    if(!best||val>best.value) best={value:val,target:tg,dmg:dmg};
  });
  return best;
}
function aiActUnit(B,u){
  var reach=bReach(B,u),roleAtk=(u.side==='p');
  var foeUnits=bUnits(B,enemyOf(u.side));
  var ownBase=B.basePos[u.side],foeBase=B.basePos[enemyOf(u.side)];
  var campThreat=false;
  if(ownBase){
    foeUnits.forEach(function(o){
      if(Math.abs(o.x-ownBase.x)+Math.abs(o.y-ownBase.y)<=4) campThreat=true;
    });
  }
  var objTiles=roleAtk?[B.basePos.e]:(campThreat&&ownBase?[ownBase]:foeUnits);
  var cmap=costMap(B,u.type,objTiles);
  var d0=(cmap[u.x+','+u.y]===undefined?40:cmap[u.x+','+u.y]);
  var best=null;
  for(var key in reach){
    var pp=key.split(','),x=+pp[0],y=+pp[1];
    var d=(cmap[key]===undefined?40:cmap[key]);
    var sc=(d0-d)*(roleAtk?3.6:2.6);
    sc+=defOf(B,x,y)*1.6;
    sc-=threatAt(B,x,y,u.side)*0.7;
    if(B.tiles[y][x].t==='village'&&B.tiles[y][x].owner!==u.side) sc+=4.5;
    if(B.tiles[y][x].t==='gate') sc+=(roleAtk?1.8:(B.siege?2.4:1.0));
    if(B.siege&&!roleAtk&&B.tiles[y][x].walled) sc+=1.2;
    if(B.tiles[y][x].t==='ford'&&roleAtk) sc+=1.0;
    var nearEnemy=0;
    foeUnits.forEach(function(o){
      var dd=Math.abs(o.x-x)+Math.abs(o.y-y);
      if(dd<=1) nearEnemy++;
    });
    sc+=nearEnemy*2.2;                                   // 包囲を意識
    if(ownBase){
      var db=Math.abs(x-ownBase.x)+Math.abs(y-ownBase.y);
      if(db>5) sc-=(db-5)*(B.siege&&!roleAtk?2.4:1.6);
      if(campThreat&&!roleAtk){
        sc+=Math.max(0,5-db)*2.2;                        // 本営が危なければ戻って守る
      }
    }
    var hit=bestAttackFrom(B,u,x,y);
    if(hit) sc+=hit.value;
    if(!best||sc>best.sc) best={sc:sc,x:x,y:y,hit:hit};
  }
  if(!best) return;
  if(best.x!==u.x||best.y!==u.y) bMove(B,u,best.x,best.y);
  var hit2=bestAttackFrom(B,u,u.x,u.y);
  if(hit2&&(!best.hit||hit2.value>=best.hit.value*0.6)) bAttack(B,u,hit2.target);
  else u.acted=true;
}

var MAP={scale:1,ox:0,oy:0,drag:null};
function layoutMap(){
  var wrap=el('mapWrap'),c=el('mapc');
  if(!wrap||!c) return;
  var w=wrap.clientWidth,h=wrap.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  if(w<8||h<8) return;
  var sc=Math.min(w/(MAP_W*TILE),h/(MAP_H*TILE));
  MAP.fit=sc;
  var cw=Math.round(MAP_W*TILE*sc),ch=Math.round(MAP_H*TILE*sc);
  c.style.width=cw+'px'; c.style.height=ch+'px';
  c.width=Math.round(cw*dpr); c.height=Math.round(ch*dpr);
  MAP.dpr=dpr;
  drawMap();
}
function drawMap(){
  var c=el('mapc'); if(!c||!c.getContext||!S) return;
  var g=c.getContext('2d'),dpr=MAP.dpr||1,sc=(MAP.scale||1)*(MAP.fit||1);
  g.setTransform(dpr,0,0,dpr,0,0);
  var W=c.width/dpr,H=c.height/dpr;
  g.clearRect(0,0,W,H);
  g.fillStyle='#091119'; g.fillRect(0,0,W,H);
  g.save();
  var ox=(W-MAP_W*TILE*sc)/2+MAP.ox,oy=(H-MAP_H*TILE*sc)/2+MAP.oy;
  g.translate(ox,oy); g.scale(sc,sc);
  drawMapTerrain(g);
  /* 1. 各勢力の支配領域オーラ（水墨風ぼかし染め） */
  CITIES.forEach(function(cy){
    var d=S.cities[cy.k],stt=findState(d.owner),col=stt?stt.col:'#777';
    var x=(cy.x+0.5)*TILE,y=(cy.y+0.5)*TILE,rad=TILE*(3.2+cy.pop/18);
    var grd=g.createRadialGradient(x,y,2,x,y,rad);
    grd.addColorStop(0,col+'36');
    grd.addColorStop(0.55,col+'18');
    grd.addColorStop(1,col+'00');
    g.fillStyle=grd;
    g.beginPath(); g.arc(x,y,rad,0,Math.PI*2); g.fill();
  });
  /* 2. 街道（外枠＋地形別内線＋選択・交戦ハイライト） */
  var sel=S.ui.sel;
  var modeFrom=(S.ui.mode&&(S.ui.mode.indexOf('move:')===0||S.ui.mode.indexOf('split:')===0))?S.ui.mode.split(':')[1]:null;
  LINKS.forEach(function(L){
    var a=findCity(L[0]),b=findCity(L[1]); if(!a||!b) return;
    var ax=(a.x+0.5)*TILE,ay=(a.y+0.5)*TILE,bx=(b.x+0.5)*TILE,by=(b.y+0.5)*TILE;
    var oa=S.cities[L[0]].owner,ob=S.cities[L[1]].owner;
    var mine=(oa===S.me||ob===S.me),bothMine=(oa===S.me&&ob===S.me);
    var war=(oa!==ob&&atWar(oa,ob));
    var isSel=(L[0]===sel||L[1]===sel);
    /* 外枠（影） */
    g.setLineDash([]);
    g.strokeStyle='rgba(5,9,14,.75)';
    g.lineWidth=isSel?4.2:3.2;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
    /* 内線 */
    g.lineWidth=isSel?2.4:(war?2.2:1.7);
    g.strokeStyle=war?'#d65347':(isSel?'#edd182':(bothMine?'#8f7b42':(mine?'#6d6138':(oa===ob?'#46586e':'#344354'))));
    g.setLineDash(L[2]==='mountain'?[3,3]:(L[2]==='river'?[2,3]:(L[2]==='hill'?[5,3]:[])));
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
    /* 交戦中の前線マーク */
    if(war){
      var mx=(ax+bx)/2,my=(ay+by)/2;
      g.setLineDash([]);
      g.fillStyle='rgba(36,12,10,.88)';
      g.beginPath(); g.arc(mx,my,5.5,0,Math.PI*2); g.fill();
      g.strokeStyle='#e87668'; g.lineWidth=1; g.stroke();
      g.fillStyle='#ffb6a8'; g.font='bold 8px monospace'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText('⚔',mx,my+0.5);
    }
  });
  g.setLineDash([]);
  /* 3. 都市ノード（城郭・城楼・軍旗・銘板・特産・将バッジ） */
  CITIES.forEach(function(cy){
    var d=S.cities[cy.k],stt=findState(d.owner),col=stt?stt.col:'#777';
    var x=(cy.x+0.5)*TILE,y=(cy.y+0.5)*TILE,r=7+Math.round(cy.pop/9);

    /* 移駐・分兵の対象ハイライト */
    if(isMoveTarget){

      g.beginPath(); g.arc(x,y,r+6,0,Math.PI*2); g.stroke();
    }

    if(sel===cy.k){

      g.beginPath(); g.arc(x,y,r+7,0,Math.PI*2); g.fill();
      g.strokeStyle='#fff3c4'; g.lineWidth=2;
      g.strokeRect(x-r-3.5,y-r-3.5,r*2+7,r*2+7);
    }
    /* 都市の影 */
    g.fillStyle='rgba(0,0,0,.62)';
    g.fillRect(x-r-1,y-r+2,r*2+2,r*2+1);
    /* 城壁基部 */
    g.fillStyle=mix(col,-0.58);
    g.fillRect(x-r,y-r,r*2,r*2);
    /* 城壁の内郭と明暗 */
    g.fillStyle=mix(col,-0.32);
    g.fillRect(x-r+1.5,y-r+3,r*2-3,r*2-4.5);
    /* 上部の勢力カラー帯 */
    g.fillStyle=col;
    g.fillRect(x-r+1,y-r+1,r*2-2,3.5);
    /* 城壁レベル2以上は女垣（凹凸の胸壁）を描画 */
    if(d.walls>=2){
      g.fillStyle=mix(col,0.22);
      for(var wx=-r+1;wx<r-1;wx+=4){

    }
    /* 城門アーチ */
    g.fillStyle='#10151c';
    g.fillRect(x-2,y+r-4,4,4);
    /* 都城は金色の宮殿屋根を重ねる */
    if(isCap){

    /* 守備兵数と都市名のプレート */
    var obs=observed(cy.k);

    var cname=cy.n[LANG]||cy.n.en;
    g.textAlign='center'; g.textBaseline='middle';
    /* 兵力バッジ */

    g.strokeStyle=(d.owner===S.me)?'rgba(236,201,110,.55)':'rgba(90,115,140,.45)';
    g.lineWidth=0.8;
    g.strokeRect(x-10,y+r+1.5,20,9.5);
    g.font='bold 8.5px monospace';
    g.fillStyle=obs.known?'#f6ebd0':'#8fa3b8';
    g.fillText(label,x,y+r+6.5);
    /* 都市名ラベル */
    g.font='8px "Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif';
    g.fillStyle='rgba(5,9,14,.85)';

function drawMapTerrain(g){
  var MW=MAP_W*TILE,MH=MAP_H*TILE,i,j;

  var bg=g.createLinearGradient(0,0,MW,MH);
  bg.addColorStop(0,'#17232c'); bg.addColorStop(0.45,'#15252e'); bg.addColorStop(1,'#111e27');
  g.fillStyle=bg; g.fillRect(0,0,MW,MH);
  /* 地域別の地勢色（中原の沃野・巴蜀盆地・西北黄土・江南水郷） */
  var regions=[
    {x:25,y:13,r:11,col:'rgba(85,105,58,.18)'},  /* 中原 */
    {x:9, y:20,r:7, col:'rgba(60,98,64,.20)'},   /* 巴蜀 */
    {x:8, y:12,r:8, col:'rgba(115,92,58,.18)'},  /* 関中・涼州 */
    {x:34,y:22,r:10,col:'rgba(48,95,78,.20)'},   /* 江南・揚州 */
    {x:21,y:20,r:8, col:'rgba(55,100,72,.18)'},  /* 荊州 */

  ];
  regions.forEach(function(rg){

  }
  /* 2. 東方の海域（渤海湾・山東半島・黄海・東シナ海の海岸線） */
  var coast=[[45,0],[44,3],[41,5],[37,5],[36,7],[38,8],[43,8],[46,10],[43,12],[40,13],[42,16],[44,19],[43,22],[44,25],[43,28],[42,30]];
  /* 浅瀬（海岸棚） */

  /* 深海 */

  for(i=0;i<coast.length;i++) g.lineTo(coast[i][0]*TILE,coast[i][1]*TILE);
  g.lineTo(MW,MH); g.closePath(); g.fill();
  /* 海岸の白波ライン */

  g.beginPath();
  for(i=0;i<coast.length;i++){
    if(i===0) g.moveTo((coast[i][0]-1.2)*TILE,coast[i][1]*TILE);

  }
  g.stroke();
  /* 海上の波紋 */
  g.strokeStyle='rgba(110,175,215,.18)'; g.lineWidth=1;
  [[46,3],[48,7],[47,14],[46,20],[48,25],[45,28]].forEach(function(w){
    var wx=w[0]*TILE,wy=w[1]*TILE;
    g.beginPath(); g.moveTo(wx-6,wy); g.quadraticCurveTo(wx-2,wy-2,wx+2,wy); g.quadraticCurveTo(wx+6,wy+2,wx+10,wy); g.stroke();
  });
  /* 3. 大河（黄河・長江・淮水・漢水）の多層描画 */
  var yh=[[0,9],[4,10],[8,11],[12,11],[15,11],[18,10],[23,10],[27,10],[31,8],[35,8],[37,7]];
  var yz=[[2,23],[6,23],[10,22],[14,20],[18,20],[22,20],[25,20],[29,21],[33,21],[37,20],[43,20]];
  var huai=[[23,15],[27,16],[31,16],[36,16],[41,16]];
  var han=[[13,16],[16,16],[19,17],[23,19]];
  function drawRiver(pts,wOuter,wInner){
    g.lineCap='round'; g.lineJoin='round';
    g.strokeStyle='rgba(16,42,60,.85)'; g.lineWidth=wOuter+2.5;
    g.beginPath(); g.moveTo(pts[0][0]*TILE,pts[0][1]*TILE);

    g.stroke();
    g.strokeStyle='#275c7a'; g.lineWidth=wOuter;
    g.stroke();
    g.strokeStyle='#4989ab'; g.lineWidth=wInner;
    g.stroke();
  }
  drawRiver(huai,2.8,1.1);
  drawRiver(han,2.8,1.1);
  drawRiver(yh,5.2,2.0);
  drawRiver(yz,5.8,2.2);
  /* 4. 山脈（秦嶺・太行・巴蜀・燕山・大別・江南諸山）の水墨峰描画 */
  var mts=[
    [3,10],[6,10],[8,14],[11,15],[14,15],[16,15],          /* 秦嶺・隴山 */
    [5,17],[7,17],[9,16],[6,20],[5,23],[12,23],[14,22],    /* 巴蜀・剣閣 */
    [22,5],[23,7],[22,9],[20,10],                          /* 太行山脈 */
    [31,2],[34,2],[38,2],[40,4],                           /* 燕山山脈 */
    [28,19],[30,22],[36,24],[39,26],[25,25],[18,24]        /* 大別山・江南丘陵 */
  ];
  mts.forEach(function(m){
    var mx=m[0]*TILE,my=m[1]*TILE;
    /* 山陰 */
    g.fillStyle='rgba(36,44,50,.85)';
    g.beginPath(); g.moveTo(mx-11,my+6); g.lineTo(mx-2,my-7); g.lineTo(mx+8,my+6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(mx-2,my+7); g.lineTo(mx+6,my-4); g.lineTo(mx+14,my+7); g.closePath(); g.fill();
    /* 山の陽面ハイライト */
    g.fillStyle='rgba(110,122,126,.45)';
    g.beginPath(); g.moveTo(mx-2,my-7); g.lineTo(mx+2,my+6); g.lineTo(mx+8,my+6); g.closePath(); g.fill();
    /* 稜線 */
    g.strokeStyle='rgba(165,178,185,.38)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(mx-8,my+3); g.lineTo(mx-2,my-7); g.lineTo(mx+4,my+2); g.stroke();
  });
  /* 5. 森林地帯の樹叢ドット */
  var woods=[[9,19],[11,22],[16,19],[19,21],[23,22],[28,23],[34,23],[39,22],[29,12],[19,14]];
  woods.forEach(function(f){
    var fx=f[0]*TILE,fy=f[1]*TILE;
    g.fillStyle='rgba(38,78,52,.55)';
    g.beginPath(); g.arc(fx,fy,5,0,Math.PI*2); g.arc(fx+5,fy+2,4,0,Math.PI*2); g.arc(fx-4,fy+2,4,0,Math.PI*2); g.fill();
  });
  /* 6. 古地図の方眼と外枠飾り */
  g.strokeStyle='rgba(145,170,195,.07)'; g.lineWidth=1;
  for(i=0;i<MAP_W;i+=4){ g.beginPath(); g.moveTo(i*TILE,0); g.lineTo(i*TILE,MH); g.stroke(); }
  for(i=0;i<MAP_H;i+=4){ g.beginPath(); g.moveTo(0,i*TILE); g.lineTo(MW,i*TILE); g.stroke(); }
  g.strokeStyle='rgba(212,178,105,.25)'; g.lineWidth=2;
  g.strokeRect(1,1,MW-2,MH-2);

function mapPick(clientX,clientY){
  var c=el('mapc'); if(!c||!MAP.sc) return null;
  var r=c.getBoundingClientRect(),sc=MAP.sc;
  var wx=(clientX-r.left-MAP.ox2)/sc,wy=(clientY-r.top-MAP.oy2)/sc;
  var best=null,bd=1e9;
  CITIES.forEach(function(cy){
    var dx=wx-(cy.x+0.5)*TILE,dy=wy-(cy.y+0.5)*TILE,d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=cy.k; }
  });
  return (bd<Math.pow(TILE*2.6,2))?best:null;
}

function advice(){

  if(S.pendingBattle) return '<b>'+t('ev_invasion').split('。')[0]+'</b>';
  if(foes.length) return t('adv_war',{s:foes[0]});
  if(s.food<up.food) return t('adv_food');
  if(s.gold<20) return t('adv_gold');
  if(availGens().length&&S.turn-S.hiredTurn>=1) return t('adv_guest');
  var disloyal=gensOf(S.me).filter(function(g){ return S.gen[g.k].loyal<45; });
  if(disloyal.length) return t('adv_gen');
  var others=aliveStates().filter(function(k){ return k!==S.me; });
  var strongest=null;
  others.forEach(function(k){ if(!strongest||powerOf(k)>powerOf(strongest)) strongest=k; });
  if(strongest&&powerOf(S.me)<powerOf(strongest)*0.8) return t('adv_weak');
  if(s.pol>=2) return t('adv_pol');
  if(s.intel<1) return t('adv_intel');

function drawChart(){
  var box=el('chartBox'),cv=el('chartCanvas'); if(!box||!cv||!S||!cv.getContext) return;
  var ser=chartSeries(),h=box.clientHeight||240,w=box.clientWidth||320;
  if(window.Chart&&LIB.chart){
    if(CHART){ try{ CHART.destroy(); }catch(e){} CHART=null; }
    cv.width=w; cv.height=h;
    try{
      CHART=new window.Chart(cv.getContext('2d'),{
        type:'line',
        data:{labels:ser.labels,datasets:ser.sets.map(function(s){
          return {label:s.label,data:s.data,borderColor:s.col,backgroundColor:s.col+'33',borderWidth:2,pointRadius:0,tension:0.25,fill:false};
        })},
        options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},
          plugins:{legend:{labels:{color:'#c8d5e4',boxWidth:10,font:{size:10}},position:'bottom'}},
          scales:{x:{ticks:{color:'#8ea3bd',font:{size:9}},grid:{color:'#1d2836'}},
                  y:{ticks:{color:'#8ea3bd',font:{size:9}},grid:{color:'#1d2836'}}}}
      });
      return;
    }catch(e){}
  }
  var g=cv.getContext('2d');
  cv.width=w; cv.height=h;
  g.clearRect(0,0,w,h);
  var max=1,i,j;
  ser.sets.forEach(function(s){ s.data.forEach(function(v){ if(v>max) max=v; }); });
  g.strokeStyle='#1d2836'; g.lineWidth=1;
  for(i=0;i<5;i++){ var yy=Math.round(h*(i/4)); g.beginPath(); g.moveTo(0,yy); g.lineTo(w,yy); g.stroke(); }
  ser.sets.forEach(function(s){
    g.strokeStyle=s.col; g.lineWidth=2; g.beginPath();
    for(j=0;j<s.data.length;j++){
      var x=s.data.length>1?(j/(s.data.length-1))*(w-10)+5:(w/2);
      var yy2=h-6-(s.data[j]/max)*(h-14);
      if(j===0) g.moveTo(x,yy2); else g.lineTo(x,yy2);
    }
    g.stroke();
  });
}

    var frac=clamp(u.hp/u.max,0,1);

      var ready=BT.tac[BT.meSide]>=sk.def.cost&&!BT.over;
      skBtn.textContent=(BT.skill?'◎ ':'')+sk.def.n[LANG]+' '+sk.def.cost;

      skBtn.classList.toggle('on',!!BT.skill);
