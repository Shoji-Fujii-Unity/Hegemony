  var eb=el('endBtn'); if(eb) eb.disabled=!!BT.over;
  var ab=el('autoBtn'); if(ab) ab.disabled=!!BT.over;
}
function renderBatPanel(){
  var box=el('batPanel'); if(!box) return;
  var u=BT.sel?bUnitAtById(BT,BT.sel):(BT.inspect?bUnitAtById(BT,BT.inspect):null);
  var html='';
  if(u){
    var stt=findState(bStateOf(BT,u.side)),T=TYPES[u.type],tile=bTile(BT,u.x,u.y);
    var isMine=(u.side===BT.meSide);
    var cnt=CNT[u.type];
    html+='<div class="unitcard"><img src="'+spriteUri(u.type,stt?stt.col:'#888')+'" alt="">'+
      '<div><div class="nm">'+T.n[LANG]+' <span style="font-size:10px;color:'+(isMine?'#8fe0a8':'#f0917f')+'">('+(isMine?t('side_me'):t('side_foe'))+')</span></div>'+
      '<div class="st">'+t('g_lead')+'HP '+u.hp+'/'+u.max+
      (u.exp?'・'+t('exp')+' '+u.exp:'')+(u.acted?'・'+t('st_spent'):'')+'</div></div></div>'+
      '<div class="statgrid"><span>'+t('th_move')+'<b>'+(u.moved?'-':moveLimit(BT,u))+'</b></span>'+
      '<span>'+t('th_range')+'<b>'+rangeOf(BT,u)+'</b></span>'+
      '<span>'+t('th_atk')+'<b>'+Math.round(T.atk*u.atkMul*(u.buff>0?1.5:1))+'</b></span>'+
      '<span>'+t('th_terr')+'<b>'+TERRAIN[tile.t].n[LANG]+'</b></span>'+
      '<span>'+t('k_morale')+'<b>'+defOf(BT,u.x,u.y)+'</b></span>'+
      '<span>'+t('th_cost2')+'<b>'+BT.tac[u.side]+'</b></span></div>'+
      '<div class="note">'+t('cnt_hint')+' '+TKEYS.map(function(k){
        return TYPES[k].glyph+'×'+(cnt[k]||1).toFixed(2).replace(/0$/,'');
      }).join(' ')+'</div>';
    if(isMine&&!u.acted){
      var tgs=bTargets(BT,u,u.x,u.y);
      if(tgs.length){
        html+='<div style="margin:4px 0">'+tgs.map(function(tg){
          var edmg=Math.round(dmgOf(BT,u,tg,false));
          if(tg.kind==='unit'){
            var du=tg.u,m=CNT[u.type][du.type]||1,fl=flankOf(BT,u,tg);
            var dist=Math.abs(u.x-du.x)+Math.abs(u.y-du.y);
            var cdmg=(TYPES[du.type].range===1&&dist<=1&&edmg<du.hp&&u.buff<2)?Math.round(dmgOf(BT,du,{kind:'unit',u:u},true)*0.6):0;
            return '<div class="rowline"><span>⚔ '+TYPES[du.type].n[LANG]+' (HP'+du.hp+')'+(m>1?' ▲':(m<1?' ▼':''))+(fl?(' +'+fl*8+'%'):'')+'</span>'+
              '<b>-'+edmg+(cdmg?(' / 反-'+cdmg):'')+'</b></div>';
          }else{
            return '<div class="rowline"><span>⚔ '+t('k_base')+' (HP'+Math.max(0,BT.baseHp[tg.side])+')</span><b>-'+edmg+'</b></div>';
          }
        }).join('')+'</div>';
      }
    }
  }else{
    html+='<div class="note" style="font-size:10.5px">'+t('hint_sel')+'</div>'+
      '<div class="note">'+t('k_weth')+'：'+t('w_'+BT.weather)+' — '+t('wd_'+BT.weather)+'</div>';
  }
  html+='<h3 style="padding:3px 0;font-family:var(--pix);font-size:11px;color:#e9d7a6">'+t('pane_log')+'</h3>';
  BT.log.slice(0,12).forEach(function(L){
    html+='<div class="logline">'+t(L.k,L.p)+'</div>';
  });
  if(box._lh!==html){ box.innerHTML=html; box._lh=html; }
}
/* ---------- 盤面のタップ ---------- */
function onBoardTap(x,y){
  if(!BT||BT.over) return;
  if(typeof audioReady==='function') audioReady();
  if(BT.skill){
    var sk=skillOf(BT,BT.meSide);
    var needT=sk&&skillNeedsTarget(sk.key);
    if(needT){
      if(useSkill(BT,BT.meSide,x,y)){ BT.skill=null; renderBattle(); saveGame(true); }
      else sfx('err');
      return;
    }
    if(useSkill(BT,BT.meSide,x,y)){ BT.skill=null; renderBattle(); saveGame(true); }
    return;
  }
  var u=bUnitAt(BT,x,y);
  if(u&&u.side===BT.meSide){
    BT.inspect=null;
    if(BT.sel===u.id){ BT.sel=null; sfx('unsel'); }
    else { BT.sel=u.id; BT.selMoved=u.moved; sfx('sel'); }
    renderBattle(); return;
  }
  var sel=BT.sel?bUnitAtById(BT,BT.sel):null;
  if(!sel||sel.side!==BT.meSide||sel.acted){
    BT.sel=null;
    BT.inspect=(u&&u.side!==BT.meSide)?u.id:null;
    if(BT.inspect) sfx('ui');
    renderBattle(); return;
  }
  var tg=null;
  bTargets(BT,sel,sel.x,sel.y).forEach(function(c2){
    if(c2.kind==='unit'){ if(c2.u.x===x&&c2.u.y===y) tg=c2; }
    else if(c2.x===x&&c2.y===y) tg=c2;
  });
  if(tg){
    pushUndoB();
    BT.inspect=null;
    bAttack(BT,sel,tg);
    BT.sel=null;
    if(!BT.over&&BT.tac[BT.meSide]>=3&&!bUnits(BT,enemyOf(BT.meSide)).length){}
    renderBattle();
    if(BT.over) finishBattle(false);
    saveGame(true);
    return;
  }
  if(!sel.moved){
    var reach=bReach(BT,sel);
    if(reach[x+','+y]!==undefined){
      pushUndoB();
      BT.inspect=null;
      var fx=sel.x,fy=sel.y;
      bMove(BT,sel,x,y);
      sfx('move');
      renderBattle({skip:sel.id});
      fxMove(sel,fx,fy,function(){ if(BT) renderBattle(); });
      var t2=bTile(BT,x,y);
      if(t2.t==='village'&&t2.owner===BT.meSide) bfx(BT,x,y,'+4','#a6f0c0');
      var near=bTargets(BT,sel,x,y);
      if(!near.length) sel.acted=true;
      renderBatPanel(); renderBattle();
      saveGame(true);
      return;
    }
  }
  BT.sel=null;
  BT.inspect=(u&&u.side!==BT.meSide)?u.id:null;
  sfx('unsel'); renderBattle();
}
/* =====================================================================
   11. 操作の割り当て
   ===================================================================== */
function on(id,fn){ var e=el(id); if(e) e.onclick=fn; }
function onChange(id,fn){ var e=el(id); if(e) e.onchange=fn; }
function curScreen(){
  var r='scrTitle';
  ['scrCamp','scrBattle'].forEach(function(s){ var n=el(s); if(n&&n.classList.contains('on')) r=s; });
  return r;
}
function newGame(){
  var seed=parseInt((el('seedInp')||{}).value,10)||PROF.seed||194;
  PROF.seed=seed; saveProfile();
  closeAllOverlays();
  newCampaign(PROF.state,PROF.diff,seed);
  BT=null; battleMounted=false;
  PROF.runs=(PROF.runs||0)+1; saveProfile();
  audioReady(); sfx('march');
  showScreen('scrCamp'); renderCamp(); saveGame(true);
}
function resumeSave(){
  var sv=loadSave();
  if(!sv){ toast(t('note_nosave')); return false; }
  S=sv; buildAdj();
  LANG=PROF.lang||LANG;
  BT=null; battleMounted=false;
  closeAllOverlays();
  if(S.over){ showScreen('scrCamp'); renderCamp(); showGameOver(S.over); return true; }
  if(S.battleData){ if(resumeBattle()) return true; }
  showScreen('scrCamp'); renderCamp();
  if(S.pendingBattle) showEvents([]);
  else if((S.notices||[]).length) showEvents([]);
  else showNextCaptive();
  return true;
}
/* ---------- 戦法ボタンの挙動（キーボード F と共通） ---------- */
function toggleSkill(){
  if(!BT||BT.over) return;
  var sk=skillOf(BT,BT.meSide);
  if(!sk||BT.tac[BT.meSide]<sk.def.cost){ sfx('err'); return; }
  if(sk.def.kind==='self'){
    pushUndoB();
    if(useSkill(BT,BT.meSide,0,0)){ BT.skill=null; sfx('skill'); renderBattle(); saveGame(true); }
    else sfx('err');
    return;
  }
  BT.skill=BT.skill?null:sk.key;
  sfx(BT.skill?'sel':'unsel');
  renderBattle();
}
/* ---------- 矢印キーで都市を選ぶ ---------- */
function moveSel(dx,dy){
  if(!S) return;
  var cur=findCity(S.ui.sel);
  if(!cur){ var mine=citiesOf(S.me)[0]; if(!mine) return; S.ui.sel=mine.k; renderCamp(); return; }
  var best=null,bs=-1e9;
  CITIES.forEach(function(c){
    if(c.k===cur.k) return;
    var vx=c.x-cur.x,vy=c.y-cur.y,len=Math.sqrt(vx*vx+vy*vy)||1;
    var dot=(vx*dx+vy*dy)/len;
    if(dot<0.30) return;
    var sc=dot*3-len/200;
    if(sc>bs){ bs=sc; best=c; }
  });
  if(!best) return;
  S.ui.sel=best.k;
  if(typeof drawMap==='function') drawMap();
  if(typeof renderCityPanel==='function') renderCityPanel();
  if(typeof renderPowers==='function') renderPowers();
  sfx('unsel');
}
function bindUI(){
  if(typeof document==='undefined') return;
  on('startBtn',function(){ audioReady(); sfx('march'); newGame(); });
  on('contBtn',function(){ audioReady(); resumeSave(); });
  on('wipeBtnT',function(){ wipeAll(); buildTitle(); toast(t('btn_wipe')); });
  on('bootResume',function(){ audioReady(); closeOverlay('bootOv'); resumeSave(); });
  on('bootNew',function(){ closeOverlay('bootOv'); lsDel(LS_S); buildTitle(); newGame(); });
  on('endSeason',function(){
    if(S&&S.pendingBattle){ toast(t('ev_invasion').split('。')[0]); showEvents([]); return; }
    endSeason();
  });
  on('chartBtn',function(){ sfx('ui'); showChart(); });
  on('closeChart',function(){ sfx('ui'); closeOverlay('chartOv'); });
  on('saveBtn',function(){ saveGame(false); });
  on('titleBack',function(){
    if(S&&!S.over) saveGame(true);
    bgmStop(); showScreen('scrTitle'); buildTitle();
  });
  on('helpBtn',function(){ sfx('ui'); showHelp(); });
  on('closeHelp',function(){ closeOverlay('helpOv'); });
  on('evOk',function(){ closeOverlay('evOv'); renderCamp(); showNextCaptive(); });
  on('endAgain',function(){ closeOverlay('endOv'); newGame(); });
  on('endTitleBtn',function(){ closeOverlay('endOv'); showScreen('scrTitle'); buildTitle(); });
  on('setupGo',function(){ confirmSetup(); });
  on('setupCancel',function(){ S.ui.setupMode=null; closeOverlay('setupOv'); renderCamp(); });
  on('sfxBtn',function(){ setSfx(!PROF.sound); });
  on('bgmBtn',function(){ setBgm(!PROF.bgm); if(PROF.bgm) sfx('drum'); });
  onChange('langSel',function(){ var s=el('langSel'); setLang(s.value); });
  on('endBtn',function(){ playerEndTurn(); });
  on('undoBtn',function(){ undoBattle(); });
  on('retreatBtn',function(){ retreatBattle(); });
  on('autoBtn',function(){ autoResolveBattle(); });
  on('skillBtn',function(){ toggleSkill(); });
  bindMap();
  document.addEventListener('keydown',function(e){
    var tg=e.target||{};
    if(/INPUT|SELECT|TEXTAREA/.test(tg.tagName||'')) return;
    var k=(e.key||'').toLowerCase();
    if(k==='escape'){
      if(!BT){ closeAllOverlays(); if(S){ S.ui.mode=null; S.ui.dip=null; renderCamp(); } return; }
      BT.skill=null; BT.sel=null; renderBattle(); return;
    }
    if(k==='n'&&curScreen()==='scrCamp'&&S&&!S.battle){ endSeason(); return; }
    if(k===' '&&curScreen()==='scrBattle'){ e.preventDefault(); playerEndTurn(); return; }
    if(k==='u'&&curScreen()==='scrBattle'){ undoBattle(); return; }
    if(k==='f'&&curScreen()==='scrBattle'){ toggleSkill(); return; }
    if(k==='r'&&curScreen()==='scrBattle'){ retreatBattle(); return; }
    if(k==='a'&&curScreen()==='scrBattle'){ autoResolveBattle(); return; }
    if(k==='arrowleft'||k==='arrowright'||k==='arrowup'||k==='arrowdown'){
      if(!S||curScreen()!=='scrCamp') return;
      e.preventDefault();
      moveSel(k==='arrowleft'?-1:(k==='arrowright'?1:0),k==='arrowup'?-1:(k==='arrowdown'?1:0));
      return;
    }
    if(k==='enter'&&S&&curScreen()==='scrCamp'&&S.ui.sel){ tapCity(S.ui.sel); return; }
    if(k==='g'&&S&&curScreen()==='scrCamp'){ showChart(); return; }
    if(k==='s'&&S&&curScreen()==='scrCamp'){ e.preventDefault(); saveGame(false); return; }
    if(k==='h'||k==='?'){ showHelp(); return; }
  });
  var first=function(){ audioReady(); if(PROF.bgm) bgmStart(); };
  document.addEventListener('pointerdown',first,{once:true});
  var rt=null;
  window.addEventListener('resize',function(){
    if(rt) clearTimeout(rt);
    rt=setTimeout(function(){
      if(curScreen()==='scrCamp') layoutMap();
      else if(curScreen()==='scrBattle'){ var c=cellSize(); if(BOARD&&Math.abs(c-BOARD.cell)>2){ battleMounted=false; } layoutBoard(); }
    },160);
  });
}
function clampPan(){
  var c=el('mapc'); if(!c||!MAP.sc) return;
  var w=c.clientWidth,h=c.clientHeight;
  var bw=MAP_W*TILE*MAP.sc,bh=MAP_H*TILE*MAP.sc;
  var mx=Math.max(0,(bw-w)/2+20),my=Math.max(0,(bh-h)/2+20);
  MAP.ox=clamp(MAP.ox,-mx,mx); MAP.oy=clamp(MAP.oy,-my,my);
}
function bindMap(){
  var c=el('mapc'); if(!c||!c.addEventListener) return;
  var tip=el('mapTip');
  c.addEventListener('pointerdown',function(e){
    MAP.drag={x:e.clientX,y:e.clientY,ox:MAP.ox,oy:MAP.oy,moved:false};
    try{ c.setPointerCapture(e.pointerId); }catch(err){}
  });
  c.addEventListener('pointermove',function(e){
    if(MAP.drag){
      var dx=e.clientX-MAP.drag.x,dy=e.clientY-MAP.drag.y;
      if(Math.abs(dx)+Math.abs(dy)>7) MAP.drag.moved=true;
      MAP.ox=MAP.drag.ox+dx; MAP.oy=MAP.drag.oy+dy;
      clampPan(); drawMap();
      if(tip) tip.style.display='none';
      return;
    }
    if(!S) return;
    var ck=mapPick(e.clientX,e.clientY);
    if(!ck){ if(tip) tip.style.display='none'; return; }
    if(!tip) return;
    tip.innerHTML=cityTipHTML(ck);
    tip.style.display='block';
    var wrap=el('mapWrap'),r=wrap?wrap.getBoundingClientRect():{left:0,top:0,width:300};
    var x=e.clientX-r.left+10,y=e.clientY-r.top+10;
    if(x>r.width-250) x-=260;
    tip.style.left=Math.max(2,x)+'px'; tip.style.top=Math.max(2,y)+'px';
  });
  c.addEventListener('pointerup',function(e){
    var wasDrag=MAP.drag&&MAP.drag.moved;
    MAP.drag=null;
    if(wasDrag) return;
    var ck=mapPick(e.clientX,e.clientY);
    tapCity(ck);
  });
  c.addEventListener('pointercancel',function(){ MAP.drag=null; });
  c.addEventListener('pointerleave',function(){ MAP.drag=null; if(tip) tip.style.display='none'; });
  c.addEventListener('wheel',function(e){
    e.preventDefault();
    MAP.scale=clamp(MAP.scale*(e.deltaY<0?1.14:0.88),0.85,3.2);
    clampPan(); drawMap();
  },{passive:false});
}
function tapCity(ck){
  if(!S||S.battle) return;
  audioReady();
  if(!ck){ S.ui.mode=null; renderCamp(); return; }
  var mode=S.ui.mode;
  if(mode){
    var parts=mode.split(':'),what=parts[0],from=parts[1];
    if(S.cities[ck]&&S.cities[ck].owner===S.me&&linkInfo(from,ck)&&ck!==from){
      moveArmy(from,ck,what==='move');
      S.ui.mode=null;
      return;
    }
    S.ui.mode=null;
  }
  S.ui.sel=ck;
  var own=S.cities[ck].owner;
  S.ui.dip=(own!==S.me&&st(own).alive)?own:null;
  sfx('ui');
  renderCamp();
}
/* ---------- 起動 ---------- */
if(typeof document!=='undefined'&&typeof document.getElementById==='function'){
  if(document.readyState&&document.readyState!=='loading') boot();
  else document.addEventListener('DOMContentLoaded',boot);
}




</script>

 help_html:'<h2>《霸业》玩法说明</h2><p>时为公元194年，汉室衰微。<b>举起一国之大旗，统一天下。</b><b>治国</b>与<b>战场</b>是分开的两个界面，规则各自独立。</p>'+
 '<h3>1. 治国</h3><ul>'+
 '<li>每季都有<b>收入</b>（商业、农业、特产）与<b>支出</b>。每点<b>政令</b>可执行一次内政、外交、军队整编或战争行动。</li>'+
 '<li>点击城池可<b>垦荒、市集、修城、练兵、征兵、安抚</b>；并可沿道路<b>调动</b>或<b>分兵</b>。</li>'+
 '<li><b>天候</b>左右丰收与战事：雨挫火攻，大旱则河可涉，雾短射程，雪滞全军。</li>'+
 '<li><b>斥候</b>可侦查敌方城池；<b>离间</b>可瓦解他人之间的关系。未经侦查的数值显示为<b>?</b>。</li>'+
 '<li><b>在野武将</b>等待聘任。武将有<b>忠诚</b>：久不赏赐便会离去。</li>'+
 '<li>势力列表中可执行<b>使节、讲和、同盟、宣战、离间</b>。<b>威望</b>给予政令；民心低于30即生叛乱。</li></ul>'+
 '<h3>2. 战场</h3><ul>'+
 '<li>回合制棋盘。每支部队<b>每回合行动一次</b>：可移动后攻击，或仅攻击。</li>'+
 '<li>摧毁<b>本营</b>、将<b>士气</b>击至零、或歼灭全部敌军即可获胜。超过{max}回合，攻方将被迫退兵。</li>'+
 '<li>部队在治国阶段编成，战斗中不能征兵。<b>村落</b>可治疗，相邻的每个友军可增伤<b>+8%</b>。</li>'+
 '<li>击杀敌军的部队成为<b>老兵</b>。久战会逐步升级，使僵局自行分出胜负。</li>'+
 '<li><b>自动结算</b>可代为推定战局；AI之间的战斗一律自动结算。</li></ul>'+
 '<h3>3. 部队与克制</h3>{units}<p><b>骑兵践踏步兵，步兵克制弩兵，弩兵压制枪兵，枪兵击破骑兵。</b>近身攻击会招来<b>反击</b>，远程则不会。骑兵不能进入山地。</p>'+
 '<h3>4. 武将与战法</h3><p>武将随军出征，其<b>统率</b>与<b>武力</b>可使士卒更为坚锐。耗尽<b>战法</b>之气力，可发动下列之一：</p>{_skills}<p>被俘武将可<b>招募、释放或处斩</b>；处斩会使各方势力皆生戒备。同一对武将再度相遇时，<b>恩怨</b>会追加伤害。</p>'+
 '<h3>5. 存档与库</h3><ul><li>进度会自动保存于<b>本浏览器之中</b>，不通过网络发送任何内容。进行中的战斗也会一并恢复。</li>'+
 '<li>音效用 Tone.js，棋盘用 PixiJS，动画用 GSAP，图表用 Chart.js——均由 CDN 加载，若无法取得则回退为内置代码。</li></ul>'+
 '<h3>操作</h3><ul><li>治国：点击城池，使用面板。<kbd>N</kbd> 结束季节 / <kbd>G</kbd> 国力图表 / <kbd>S</kbd> 保存 / <kbd>方向键</kbd> 选城 / <kbd>Enter</kbd> 决定。</li>'+
 '<li>战斗：先点部队，再点绿格移动或黄格攻击。<kbd>Space</kbd> 结束回合 / <kbd>U</kbd> 撤销 / <kbd>F</kbd> 战法 / <kbd>R</kbd> 撤退 / <kbd>A</kbd> 自动结算 / <kbd>Esc</kbd> 取消。</li></ul>'
};
